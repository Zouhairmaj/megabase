[workspace]
resolver = "2"
members = [
    "crates/megabase",
    "crates/megabase-core",
    "crates/megabase-server",
    "crates/megabase-rest",
    "crates/megabase-auth",
    "crates/megabase-realtime",
    "crates/megabase-storage",
    "crates/megabase-functions",
    "crates/megabase-pooler",
    "crates/megabase-meta",
    "crates/megabase-studio",
    "tools/megabase-coverage",
    "tools/megabase-guard",
    "tools/megabase-backlog",
    "judge/harness",
]
exclude = ["site", "fuzz", "third_party/sqlx-mysql"]
default-members = [
    "crates/megabase",
    "crates/megabase-core",
    "crates/megabase-server",
    "crates/megabase-rest",
    "crates/megabase-auth",
    "crates/megabase-realtime",
    "crates/megabase-storage",
    "crates/megabase-functions",
    "crates/megabase-pooler",
    "crates/megabase-meta",
    "crates/megabase-studio",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Zouhairmaj/megabase"
rust-version = "1.89"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "timeout", "trace", "uuid"] }
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-none", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
regex = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json"] }
anyhow = "1"
base64 = "0.22"
chacha20 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
tokio-postgres = "0.7"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.27.0", features = ["v4"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

megabase-core = { path = "crates/megabase-core" }
megabase-server = { path = "crates/megabase-server" }
megabase-rest = { path = "crates/megabase-rest" }
megabase-auth = { path = "crates/megabase-auth" }
megabase-realtime = { path = "crates/megabase-realtime" }
megabase-storage = { path = "crates/megabase-storage" }
megabase-functions = { path = "crates/megabase-functions" }
megabase-pooler = { path = "crates/megabase-pooler" }
megabase-meta = { path = "crates/megabase-meta" }
megabase-studio = { path = "crates/megabase-studio" }

# Product crates do not use `unsafe`. site/ repeats this lint locally
# because it is excluded from the workspace. fuzz/ does not: the libfuzzer
# harness expands to `unsafe`.
[workspace.lints.rust]
unsafe_code = "forbid"

# Clone and borrow lints. CI runs clippy with `-D warnings`, which also
# denies every other warning. These are deny so a per-crate `cargo clippy`
# fails on them without extra flags.
[workspace.lints.clippy]
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
needless_pass_by_value = "deny"
clone_on_copy = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
map_clone = "deny"
unnecessary_to_owned = "deny"

# sqlx-mysql 0.8.6 depends on `rsa` unconditionally. Cargo still records that
# crate in Cargo.lock when only the postgres feature is enabled, and
# OpenSSF Scorecard flags RUSTSEC-2023-0071. The patch makes `rsa` optional
# and leaves it off. sqlx 0.9 does the same, but it requires Rust 1.94.
[patch.crates-io]
sqlx-mysql = { path = "third_party/sqlx-mysql" }
