<?xml version="1.0" encoding="UTF-8"?>
<!-- Megabase Logo - Original design, Apache-2.0 licensed -->
<!-- A bold geometric "M" formed by three ascending pillars representing database columns -->
<!-- Color: Deep blue (#1e3a5f) to purple (#6366f1) gradient - distinct from Supabase green -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="megaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="50%" style="stop-color:#3b5998"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="megaGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b5998"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Base platform -->
  <rect x="12" y="100" width="104" height="12" rx="3" fill="url(#megaGrad)"/>
  <!-- Left pillar -->
  <rect x="16" y="44" width="24" height="56" rx="4" fill="url(#megaGrad)"/>
  <!-- Center pillar (tallest) -->
  <rect x="52" y="16" width="24" height="84" rx="4" fill="url(#megaGradLight)"/>
  <!-- Right pillar -->
  <rect x="88" y="44" width="24" height="56" rx="4" fill="url(#megaGrad)"/>
  <!-- Connecting beam top-left to center -->
  <polygon points="28,44 64,16 64,28 40,48" fill="url(#megaGrad)" opacity="0.9"/>
  <!-- Connecting beam center to top-right -->
  <polygon points="64,16 100,44 88,48 64,28" fill="url(#megaGrad)" opacity="0.9"/>
</svg>
