<?xml version="1.0" encoding="UTF-8"?>
<!-- Megabase Wordmark (Dark mode) - Original design, Apache-2.0 licensed -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="wordGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="wordGradDarkLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Mini logo -->
  <g transform="translate(0, 8) scale(0.5)">
    <rect x="12" y="100" width="104" height="12" rx="3" fill="url(#wordGradDark)"/>
    <rect x="16" y="44" width="24" height="56" rx="4" fill="url(#wordGradDark)"/>
    <rect x="52" y="16" width="24" height="84" rx="4" fill="url(#wordGradDarkLight)"/>
    <rect x="88" y="44" width="24" height="56" rx="4" fill="url(#wordGradDark)"/>
    <polygon points="28,44 64,16 64,28 40,48" fill="url(#wordGradDark)" opacity="0.9"/>
    <polygon points="64,16 100,44 88,48 64,28" fill="url(#wordGradDark)" opacity="0.9"/>
  </g>
  <!-- Text -->
  <text x="80" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="#e2e8f0">
    <tspan>Mega</tspan><tspan fill="url(#wordGradDarkLight)">base</tspan>
  </text>
</svg>
