# Storage, Postgres Meta and Realtime smoke cases.

[[case]]
id = "storage.bucket.list"
description = "List buckets with the service role"
units = ["storage:route:GET /storage/v1/bucket"]
[[case.step]]
method = "GET"
path = "/storage/v1/bucket"
key = "service_role"

[[case]]
id = "storage.bucket.missing"
description = "Unknown bucket is a structured not-found error"
units = ["storage:route:GET /storage/v1/bucket/{bucketId}"]
[[case.step]]
method = "GET"
path = "/storage/v1/bucket/judge-does-not-exist"
key = "service_role"

[[case]]
id = "meta.health"
description = "Postgres Meta health through /pg (admin key)"
units = ["meta:route:GET /pg/health"]
[[case.step]]
method = "GET"
path = "/pg/health"
key = "service_role"

[[case]]
id = "meta.config.version"
description = "Postgres server version as reported by Postgres Meta"
units = ["meta:route:GET /pg/config/version"]
[[case.step]]
method = "GET"
path = "/pg/config/version"
key = "service_role"

[[case]]
id = "realtime.ping"
description = "Realtime HTTP API ping"
units = ["realtime:route:GET /realtime/v1/api/ping"]
[[case.step]]
method = "GET"
path = "/realtime/v1/api/ping"
