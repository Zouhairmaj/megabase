[[case]]
id = "storage.s3.unsigned.delete-object"
description = "Unsigned DeleteObject is AccessDenied"
units = ["storage:route:DELETE /storage/v1/s3/{Bucket}/{*}"]
[[case.step]]
method = "DELETE"
path = "/storage/v1/s3/judge-s3/dir/file.txt"
key = "none"

[[case]]
id = "storage.s3.unsigned.abort-multipart-upload"
description = "Unsigned AbortMultipartUpload is AccessDenied"
units = ["storage:route:DELETE /storage/v1/s3/{Bucket}/{*}?uploadId"]
[[case.step]]
method = "DELETE"
path = "/storage/v1/s3/judge-s3/dir/file.txt?uploadId=judge-upload"
key = "none"

[[case]]
id = "storage.s3.unsigned.delete-objects"
description = "Unsigned bodiless DeleteObjects is AccessDenied"
units = ["storage:route:POST /storage/v1/s3/{Bucket}?delete"]
[[case.step]]
method = "POST"
path = "/storage/v1/s3/judge-s3?delete"
key = "none"

[[case]]
id = "storage.s3.unsigned.post-policy"
description = "A POST policy form without the signature fields is InvalidSignature"
units = ["storage:route:POST /storage/v1/s3/{Bucket}|content-type=multipart/form-data"]
[[case.step]]
method = "POST"
path = "/storage/v1/s3/judge-s3"
key = "none"
headers = { "Content-Type" = "multipart/form-data; boundary=judge-s3-boundary" }
body = "--judge-s3-boundary\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\ndir/file.txt\r\n--judge-s3-boundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"file.txt\"\r\nContent-Type: text/plain\r\n\r\nhello\r\n--judge-s3-boundary--\r\n"

[[case]]
id = "storage.s3.unsigned.create-multipart-upload"
description = "Unsigned bodiless CreateMultipartUpload is AccessDenied"
units = ["storage:route:POST /storage/v1/s3/{Bucket}/{*}?uploads"]
[[case.step]]
method = "POST"
path = "/storage/v1/s3/judge-s3/dir/file.txt?uploads"
key = "none"

[[case]]
id = "storage.s3.unsigned.complete-multipart-upload"
description = "Unsigned bodiless CompleteMultipartUpload is AccessDenied"
units = ["storage:route:POST /storage/v1/s3/{Bucket}/{*}?uploadId"]
[[case.step]]
method = "POST"
path = "/storage/v1/s3/judge-s3/dir/file.txt?uploadId=judge-upload"
key = "none"

# The PUT units are served by #450. Bodiless, so the preHandler answers
# before the command or its `x-amz-copy-source` header matters.

[[case]]
id = "storage.s3.unsigned.create-bucket"
description = "Unsigned bodiless CreateBucket is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}"]
[[case.step]]
method = "PUT"
path = "/storage/v1/s3/judge-s3"
key = "none"

[[case]]
id = "storage.s3.unsigned.put-bucket-lifecycle"
description = "Unsigned bodiless PutBucketLifecycleConfiguration is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}?lifecycle"]
[[case.step]]
method = "PUT"
path = "/storage/v1/s3/judge-s3?lifecycle"
key = "none"

[[case]]
id = "storage.s3.unsigned.put-object"
description = "Unsigned bodiless PutObject is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}/{*}"]
[[case.step]]
method = "PUT"
path = "/storage/v1/s3/judge-s3/dir/file.txt"
key = "none"

[[case]]
id = "storage.s3.unsigned.copy-object"
description = "Unsigned bodiless CopyObject is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}/{*}|x-amz-copy-source"]
[[case.step]]
method = "PUT"
path = "/storage/v1/s3/judge-s3/dir/copy.txt"
key = "none"
headers = { "x-amz-copy-source" = "judge-s3/dir/file.txt" }

[[case]]
id = "storage.s3.unsigned.upload-part"
description = "Unsigned bodiless UploadPart is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}/{*}?uploadId&partNumber"]
[[case.step]]
method = "PUT"
path = "/storage/v1/s3/judge-s3/dir/file.txt?uploadId=judge-upload&partNumber=1"
key = "none"

[[case]]
id = "storage.s3.unsigned.upload-part-copy"
description = "Unsigned bodiless UploadPartCopy is AccessDenied"
units = ["storage:route:PUT /storage/v1/s3/{Bucket}/{*}?partNumber&uploadId|x-amz-copy-source"]
[[case.step]]
