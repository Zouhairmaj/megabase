# Storage smoke cases.

[[case]]
id = "storage.bucket.list"
description = "List buckets with the service role"
units = ["storage:route:GET /storage/v1/bucket"]
[[case.step]]
method = "GET"
path = "/storage/v1/bucket"
key = "service_role"

[[case]]
id = "storage.bucket.missing"
description = "Unknown bucket is a structured not-found error"
units = ["storage:route:GET /storage/v1/bucket/{bucketId}"]
[[case.step]]
method = "GET"
path = "/storage/v1/bucket/judge-does-not-exist"
key = "service_role"

# Bucket writes (issue 56). Ids sort after `storage.bucket.list`, so the
# buckets these cases create never appear in that list on either stack.
# `{{run}}` keeps bucket names unique across judge runs on a reused volume.
# The bucket DELETE route is not a Level 2 unit, so cases cannot clean up.
# On a reused volume both stacks keep earlier buckets, so the list compares
# equal once Megabase serves create; CI starts from fresh volumes.

[[case]]
id = "storage.bucket.write.create"
description = "Create a bucket with only a name; the response echoes the name"
units = ["storage:route:POST /storage/v1/bucket"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge-create-{{run}}" }

[[case]]
id = "storage.bucket.write.create-options"
description = "Create with id, public, a size string and MIME types; the stored row is normalized"
units = ["storage:route:POST /storage/v1/bucket", "storage:route:GET /storage/v1/bucket/{bucketId}"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { id = "judge-options-id-{{run}}", name = "judge-options-{{run}}", public = true, file_size_limit = "1.5MB", allowed_mime_types = ["image/PNG", "image/png", ""] }
[[case.step]]
method = "GET"
path = "/storage/v1/bucket/judge-options-id-{{run}}"
key = "service_role"

[[case]]
id = "storage.bucket.write.create-duplicate"
description = "Creating an existing bucket again is BucketAlreadyExists"
units = ["storage:route:POST /storage/v1/bucket"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge-duplicate-{{run}}" }
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge-duplicate-{{run}}" }

[[case]]
id = "storage.bucket.write.create-invalid-name"
description = "A name with a slash is InvalidBucketName"
units = ["storage:route:POST /storage/v1/bucket"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge/invalid-{{run}}" }

[[case]]
id = "storage.bucket.write.create-too-large"
description = "A file_size_limit above FILE_SIZE_LIMIT is EntityTooLarge"
units = ["storage:route:POST /storage/v1/bucket"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge-too-large-{{run}}", file_size_limit = "1GB" }

[[case]]
id = "storage.bucket.write.update"
description = "Update public, the size limit and MIME types; the stored row changes"
units = ["storage:route:POST /storage/v1/bucket", "storage:route:PUT /storage/v1/bucket/{bucketId}", "storage:route:GET /storage/v1/bucket/{bucketId}"]
[[case.step]]
method = "POST"
path = "/storage/v1/bucket"
key = "service_role"
json = { name = "judge-update-{{run}}", file_size_limit = 1024, allowed_mime_types = ["image/png"] }
[[case.step]]
method = "PUT"
path = "/storage/v1/bucket/judge-update-{{run}}"
key = "service_role"
json = { public = true, file_size_limit = "2KB", allowed_mime_types = ["image/jpeg", "text/plain;charset=utf-8"] }
[[case.step]]
method = "GET"
path = "/storage/v1/bucket/judge-update-{{run}}"
key = "service_role"

[[case]]
id = "storage.bucket.write.update-missing"
description = "Updating an unknown bucket is NoSuchBucket"
units = ["storage:route:PUT /storage/v1/bucket/{bucketId}"]
[[case.step]]
method = "PUT"
path = "/storage/v1/bucket/judge-update-missing-{{run}}"
key = "service_role"
json = { public = true }

[[case]]
id = "storage.bucket.write.lifecycle-get"
description = "Lifecycle read is FeatureNotEnabled in the self-hosted configuration"
units = ["storage:route:GET /storage/v1/bucket/{bucketId}/lifecycle"]
[[case.step]]
method = "GET"
path = "/storage/v1/bucket/judge-does-not-exist/lifecycle"
key = "service_role"

[[case]]
id = "storage.bucket.write.lifecycle-put"
description = "Lifecycle write with a valid body is FeatureNotEnabled in the self-hosted configuration"
units = ["storage:route:PUT /storage/v1/bucket/{bucketId}/lifecycle"]
[[case.step]]
method = "PUT"
path = "/storage/v1/bucket/judge-does-not-exist/lifecycle"
key = "service_role"
json = { rules = [{ status = "Enabled", filter = {}, noncurrentVersionExpiration = { noncurrentDays = 30 } }] }

# Image render pre-render errors (specs/storage/render.md). The static token
# is HS256 over the public JWT_SECRET from `.env.example`, with claims
# `url = "judge-render/other.png"`, `iat`, and `exp` in 2100 and no `scope`
# (a legacy download token). Fixture data only.

[[case]]
id = "storage.render.sign_wrong_url"
description = "A download token signed for another object is InvalidSignature"
units = ["storage:route:GET /storage/v1/render/image/sign/{bucketName}/{*}"]
[[case.step]]
method = "GET"
path = "/storage/v1/render/image/sign/judge-render/judge-render.png?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTcwMDAwMDAwMCwidXJsIjoianVkZ2UtcmVuZGVyL290aGVyLnBuZyJ9.UpEn1BNC5q1iRGwC9Nsl8HJYWFzwx7eBQaqrO2BCll8"
key = "none"

[[case]]
id = "storage.render.public_invalid_key"
description = "An object name with %23 fails the key check before any lookup"
units = ["storage:route:GET /storage/v1/render/image/public/{bucketName}/{*}"]
[[case.step]]
method = "GET"
path = "/storage/v1/render/image/public/judge-render/bad%23name.png"
key = "none"

[[case]]
id = "storage.render.authenticated_invalid_key"
description = "With the service_role key, an object name with %23 is InvalidKey"
units = ["storage:route:GET /storage/v1/render/image/authenticated/{bucketName}/{*}"]
[[case.step]]
method = "GET"
path = "/storage/v1/render/image/authenticated/judge-render/bad%23name.png"
key = "service_role"

# S3 protocol, unsigned requests (specs/storage/s3.md, issue 64). The
# self-hosted stack registers the S3 routes, and `signatureV4` runs as a
# preHandler before any command is picked or the database is used. A
# request with no AWS SigV4 signature is therefore `AccessDenied` /
# `Missing signature` (HTTP 403, S3 XML) whatever its query or headers
# would select, and the bucket need not exist. One case per unit. No step
# sends a body except the POST policy form, so Fastify parses nothing.

[[case]]
id = "storage.s3.unsigned.list-buckets"
description = "Unsigned ListBuckets is AccessDenied with an empty Resource"
units = ["storage:route:GET /storage/v1/s3"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-bucket"
description = "Unsigned GET on a bucket is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3"
key = "none"

[[case]]
id = "storage.s3.unsigned.list-objects-v2"
description = "Unsigned ListObjectsV2 is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}?list-type=2"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3?list-type=2&prefix=dir%2F"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-bucket-location"
description = "Unsigned GetBucketLocation is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}?location"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3?location"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-bucket-versioning"
description = "Unsigned GetBucketVersioning is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}?versioning"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3?versioning"
key = "none"

[[case]]
id = "storage.s3.unsigned.list-multipart-uploads"
description = "Unsigned ListMultipartUploads is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}?uploads"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3?uploads"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-bucket-lifecycle"
description = "Unsigned GetBucketLifecycleConfiguration is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}?lifecycle"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3?lifecycle"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-object"
description = "Unsigned GetObject is AccessDenied; Resource is bucket/key"
units = ["storage:route:GET /storage/v1/s3/{Bucket}/{*}"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3/dir/file.txt"
key = "none"

[[case]]
id = "storage.s3.unsigned.get-object-bearer"
description = "A Supabase bearer token is not a SigV4 signature, so GetObject is still AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}/{*}"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3/file.txt"
key = "service_role"

[[case]]
id = "storage.s3.unsigned.get-object-tagging"
description = "Unsigned GetObjectTagging is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}/{*}?tagging"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3/dir/file.txt?tagging"
key = "none"

[[case]]
id = "storage.s3.unsigned.list-parts"
description = "Unsigned ListParts is AccessDenied"
units = ["storage:route:GET /storage/v1/s3/{Bucket}/{*}?uploadId"]
[[case.step]]
method = "GET"
path = "/storage/v1/s3/judge-s3/dir/file.txt?uploadId=judge-upload"
key = "none"

[[case]]
id = "storage.s3.unsigned.head-bucket"
description = "Unsigned HeadBucket is 403 with the XML content type and no body"
units = ["storage:route:HEAD /storage/v1/s3/{Bucket}"]
[[case.step]]
method = "HEAD"
path = "/storage/v1/s3/judge-s3"
key = "none"

[[case]]
id = "storage.s3.unsigned.head-object"
description = "Unsigned HeadObject is 403 with the XML content type and no body"
units = ["storage:route:HEAD /storage/v1/s3/{Bucket}/{*}"]
[[case.step]]
method = "HEAD"
path = "/storage/v1/s3/judge-s3/dir/file.txt"
key = "none"

