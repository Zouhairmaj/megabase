[[case.step]]
method = "GET"
path = "/rest/v1/spans?during=sr.[8,9)"

[[case]]
id = "rest.filter.nxr"
description = "Does not extend right of. Only [1,4) ends at or before 5."
units = ["rest:filter-operator:nxr"]
[[case.step]]
method = "GET"
path = "/rest/v1/spans?during=nxr.[1,5)"

[[case]]
id = "rest.filter.nxl"
description = "Does not extend left of. Only [10,12) starts at or after 9."
