[[case]]
id = "rest.query.and"
description = "and combines filters on the root resource"
units = ["rest:query-param:and", "rest:query-param:order"]
[[case.step]]
method = "GET"
path = "/rest/v1/todos?and=(done.eq.true,priority.gte.1)&order=id"

[[case]]
id = "rest.query.or"
description = "or keeps rows that match either filter"
units = ["rest:query-param:or", "rest:query-param:order"]
[[case.step]]
method = "GET"
path = "/rest/v1/todos?or=(id.eq.1,id.eq.3)&order=id"

[[case]]
id = "rest.query.columns"
description = "columns is accepted on a read and does not project the row"
units = ["rest:query-param:columns", "rest:query-param:order"]
[[case.step]]
method = "GET"
path = "/rest/v1/todos?columns=id,title&order=id"

[[case]]
id = "rest.query.on-conflict"
description = "on_conflict is accepted on a read and does not change the row"
units = ["rest:query-param:on_conflict", "rest:query-param:select", "rest:query-param:order"]
[[case.step]]
method = "GET"
path = "/rest/v1/todos?on_conflict=id&select=id&order=id"

