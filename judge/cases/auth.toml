path = "/auth/v1/signup"
json = { email = "judge-same-{{run}}@example.com", password = "judge-password-1" }
capture = { token = "/access_token" }
[[case.step]]
method = "PUT"
path = "/auth/v1/user"
headers = { Authorization = "Bearer {{token}}" }
json = { password = "judge-password-1" }

