# Adversarial Auth (issue #117). Tokens below are fixtures for the public
# demo JWT_SECRET in vendor/supabase/docker/.env.example. `forged` is HMAC'd
# with a different secret. `expired` is HMAC'd with the demo secret and
# exp in 2001, so a verifier that skips exp still accepts it. `tampered`
# keeps the owner-a signature after the payload role was rewritten to
# service_role. `alg-none` is an unsecured service_role token.
[[case]]
id = "auth.adversarial.jwt.malformed"
description = "A non-JWT bearer is rejected on GET /user"
units = ["auth:route:GET /auth/v1/user"]
[[case.step]]
method = "GET"
path = "/auth/v1/user"
headers = { Authorization = "Bearer not-a-jwt" }

[[case]]
id = "auth.adversarial.jwt.truncated"
description = "A two-segment bearer is rejected on GET /user"
units = ["auth:route:GET /auth/v1/user"]
[[case.step]]
method = "GET"
path = "/auth/v1/user"
headers = { Authorization = "Bearer eyJhbGciOiJIUzI1NiJ9.e30" }

[[case]]
id = "auth.adversarial.jwt.alg-none"
description = "An alg=none service_role bearer is rejected on GET /user"
units = ["auth:route:GET /auth/v1/user"]
[[case.step]]
method = "GET"
path = "/auth/v1/user"
headers = { Authorization = "Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxNzk5NTM1NjAwfQ." }

[[case]]
id = "auth.adversarial.jwt.forged"
