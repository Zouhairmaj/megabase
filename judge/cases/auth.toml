[[case.step]]
method = "POST"
path = "/auth/v1/signup"
json = { email = "judge-unlink-{{run}}@example.com", password = "judge-password-1" }
capture = { token = "/access_token", identity = "/user/identities/0/id" }
[[case.step]]
method = "DELETE"
