units = ["auth:route:GET /auth/v1/verify"]
[[case.step]]
method = "GET"
path = "/auth/v1/verify?type=signup&token=deadbeef&redirect_to=http%3A%2F%2F2130706433%2Fphish"
key = "none"

[[case]]
id = "auth.adversarial.redirect.protocol-relative"
description = "GET /verify does not honor a protocol-relative external URL"
units = ["auth:route:GET /auth/v1/verify"]
[[case.step]]
method = "GET"
path = "/auth/v1/verify?type=signup&token=deadbeef&redirect_to=%2F%2Fevil.example%2Fphish"
key = "none"

[[case]]
id = "auth.adversarial.redirect.same-origin"
description = "GET /verify keeps a same-origin redirect_to path"
units = ["auth:route:GET /auth/v1/verify"]
[[case.step]]
method = "GET"
path = "/auth/v1/verify?type=signup&token=deadbeef&redirect_to=http%3A%2F%2Flocalhost%3A3000%2Fwelcome"
key = "none"

[[case]]
id = "auth.adversarial.redirect.authorize"
description = "Authorize with a disabled provider and an external redirect_to does not send the browser off-site"
units = ["auth:route:GET /auth/v1/authorize"]
[[case.step]]
method = "GET"
path = "/auth/v1/authorize?provider=github&redirect_to=https%3A%2F%2Fevil.example%2Fphish"
key = "none"

