headers = { Authorization = "Bearer {{token}}" }

[[case]]
id = "auth.user.put-password"
description = "PUT /user stores a new password and rejects the previous refresh token"
units = ["auth:route:PUT /auth/v1/user"]
[[case.step]]
method = "POST"
path = "/auth/v1/signup"
json = { email = "judge-pw-{{run}}@example.com", password = "judge-password-1" }
capture = { token = "/access_token", refresh = "/refresh_token" }
[[case.step]]
method = "PUT"
path = "/auth/v1/user"
headers = { Authorization = "Bearer {{token}}" }
json = { password = "judge-password-2" }
[[case.step]]
method = "POST"
path = "/auth/v1/token?grant_type=refresh_token"
json = { refresh_token = "{{refresh}}" }

[[case]]
id = "auth.user.put-phone"
description = "PUT /user autoconfirms an E.164 phone"
units = ["auth:route:PUT /auth/v1/user"]
[[case.step]]
method = "POST"
path = "/auth/v1/signup"
json = { email = "judge-phone-{{run}}@example.com", password = "judge-password-1" }
capture = { token = "/access_token" }
[[case.step]]
method = "PUT"
path = "/auth/v1/user"
headers = { Authorization = "Bearer {{token}}" }
json = { phone = "+14155550100" }
