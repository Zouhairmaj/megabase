# cargo-deny policy for the Megabase workspace (not vendor/ or site/).
#
# [bans] allow is deny-by-default: a crate in the resolved graph that is
# not listed, and is not a workspace member, fails `cargo deny check bans`.
# Workspace members are allowed via `allow-workspace`. site/ is excluded
# from the workspace, so this file does not cover site/Cargo.lock.
#
# The list is every external crate in Cargo.lock, plus product crates the
# architecture already chose that are not dependencies yet (`sqlx`,
# `jsonwebtoken`). axum, tokio, serde, tower and tracing are in the graph.
#
# To propose a new crate:
# 1. Check this list and [workspace.dependencies] for a crate that already
#    does the job.
# 2. Add its crates.io name, and every new transitive crate that
#    `cargo deny check bans` reports, to `allow` below, in alphabetical order.
# 3. Say in the PR why it is needed. Do not add a name only to silence the check.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = false

[advisories]
yanked = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Wildcard version requirements are denied.
wildcards = "deny"
# Path and workspace dependencies without explicit version requirements are
# treated as wildcards by cargo-deny; allow them so internal crate references pass.
