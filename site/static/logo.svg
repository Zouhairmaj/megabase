  <rect x="11" y="0" width="8" height="8" fill="#303235"/>
  <rect x="22" y="0" width="8" height="8" fill="#303235"/>
  <rect x="0" y="11" width="8" height="8" fill="#303235"/>
  <rect x="11" y="11" width="8" height="8" fill="#00D892"/>
  <rect x="22" y="11" width="8" height="8" fill="#303235"/>
  <rect x="0" y="22" width="8" height="8" fill="#303235"/>
  <rect x="11" y="22" width="8" height="8" fill="#303235"/>
  <rect x="22" y="22" width="8" height="8" fill="#303235"/>
</svg>
