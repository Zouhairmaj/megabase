# cargo audit config (`just audit`, CI). Loaded from `.cargo/audit.toml`.
#
# RUSTSEC-2023-0071 is the Marvin timing attack in rsa 0.9.10. sqlx-macros-core
# 0.8.6 always depends on sqlx-mysql, and that driver depends on rsa. There is
# no fixed rsa release. Megabase enables only the postgres driver, so the
# binary does not link rsa. Drop this ignore when sqlx stops pulling it or
# rsa ships a fix.

[advisories]
ignore = ["RUSTSEC-2023-0071"]
