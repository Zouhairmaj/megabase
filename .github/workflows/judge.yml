name: Judge

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  judge:
    name: Judge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build harness and binary
        run: cargo build --release --locked -p megabase -p megabase-judge --bin megabase --bin megabase-judge
      - name: Reference stack
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example \
            up -d --wait
      - name: Megabase on :8100
        run: |
          MEGABASE_PORT=8100 MEGABASE_HOST=0.0.0.0 \
            ./target/release/megabase > /tmp/megabase.log 2>&1 &
          echo $! > /tmp/megabase.pid
      - name: Wait
        run: ./target/release/megabase-judge wait --timeout 240
      - name: Run cases
        run: |
          ./target/release/megabase-judge run \
            --cases judge/cases \
            --out /tmp/judge-results.json \
            --baseline coverage/judge-results.json \
            --summary /tmp/judge-summary.md
          cat /tmp/judge-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: vendor/ stayed clean
        run: |
          git -C vendor/supabase status --short
          test -z "$(git -C vendor/supabase status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-results
          path: |
            /tmp/judge-results.json
            /tmp/judge-summary.md
            /tmp/megabase.log
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example logs --tail 80
          cat /tmp/megabase.log || true
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Judge\n\n_(no summary)_';
            try { body = '## Judge\n\n' + fs.readFileSync('/tmp/judge-summary.md', 'utf8'); }
            catch (e) { body += '\n\n' + e.message; }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  coverage-on-main:
    name: Update coverage on main
    needs: judge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: judge-results
          path: /tmp/judge
      - run: cp /tmp/judge/judge-results.json coverage/judge-results.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p megabase-coverage -- update
      - name: Commit generated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage README.md PROGRESS.md docs/COMPATIBILITY.md docs/epics
          if git diff --staged --quiet; then
            echo "no coverage drift"
            exit 0
          fi
          git commit -m "ci(coverage): regenerate status from judge on main"
          git push
