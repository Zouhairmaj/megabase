name: Judge

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: judge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  judge:
    name: Judge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build harness and binary
        run: cargo build --release --locked -p megabase -p megabase-judge --bin megabase --bin megabase-judge
      - name: Reference stack
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example \
            up -d --wait --wait-timeout 300
      - name: Megabase on :8100
        run: |
          set -euo pipefail
          JWT_SECRET=$(grep '^JWT_SECRET=' vendor/supabase/docker/.env.example | cut -d= -f2-)
          POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' vendor/supabase/docker/.env.example | cut -d= -f2-)
          POSTGRES_DB=$(grep '^POSTGRES_DB=' vendor/supabase/docker/.env.example | cut -d= -f2-)
          # Host :5432 is Supavisor. Talk to the compose Postgres directly,
          # same as judge/compose.override.yml's megabase service.
          DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' supabase-db)
          DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@${DB_IP}:5432/${POSTGRES_DB}"
          MEGABASE_PORT=8100 MEGABASE_HOST=0.0.0.0 \
            JWT_SECRET="$JWT_SECRET" DATABASE_URL="$DATABASE_URL" \
            ./target/release/megabase > /tmp/megabase.log 2>&1 &
          echo $! > /tmp/megabase.pid
      - name: Wait
        run: ./target/release/megabase-judge wait --timeout 240
      - name: Run cases
        run: |
          ./target/release/megabase-judge run \
            --cases judge/cases \
            --out /tmp/judge-results.json \
            --baseline coverage/judge-results.json \
            --summary /tmp/judge-summary.md
          cat /tmp/judge-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: vendor/ stayed clean
        run: |
          git -C vendor/supabase status --short
          test -z "$(git -C vendor/supabase status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: judge-results
          path: |
            /tmp/judge-results.json
            /tmp/judge-summary.md
            /tmp/megabase.log
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example logs --tail 80
          docker inspect --format '{{.State.Status}} {{json .State.Health}}' supabase-pooler || true
          cat /tmp/megabase.log || true
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let body = '## Judge\n\n_(no summary)_';
            try {
              body = '## Judge\n\n' + fs.readFileSync('/tmp/judge-summary.md', 'utf8');
            } catch {
              body += '\n\nCases did not run (reference stack or harness failed first).';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  coverage-on-main:
    name: Update coverage on main
    needs: judge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: judge-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-results
          path: /tmp/judge
      - run: cp /tmp/judge/judge-results.json coverage/judge-results.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run --locked -p megabase-coverage -- update
      - name: Commit generated status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage README.md PROGRESS.md docs/COMPATIBILITY.md docs/epics
          if git diff --staged --quiet; then
            echo "no coverage drift"
            exit 0
          fi
          git commit -m "ci(coverage): regenerate status from judge on main"
          git push
