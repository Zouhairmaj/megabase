name: Judge

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Composite actions cannot read secrets or vars. Empty on fork PRs.
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET_NAME: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT_URL: ${{ vars.SCCACHE_ENDPOINT }}

permissions:
  contents: read

# Cancel superseded PR runs. Keep main and workflow_dispatch to completion.
# The matrix below is inside one run, so cancelling the run does not cancel
# one service while another continues.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Judge build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: mold
      - uses: ./.github/actions/linux-mold
      - name: Build harness and binary
        run: cargo build --release --locked -p megabase -p megabase-judge --bin megabase --bin megabase-judge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: judge-binaries
          retention-days: 1
          path: |
            target/release/megabase
            target/release/megabase-judge
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  services:
    name: Judge services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: judge/cases
      - id: list
        name: List judge/cases services
        run: |
          set -euo pipefail
          json=$(find judge/cases -maxdepth 1 -name '*.toml' -printf '%f\n' | sed 's/\.toml$//' | sort | jq -R . | jq -sc .)
          if [ "$json" = "[]" ]; then
            echo "::error::judge/cases has no toml files"
            exit 1
          fi
          echo "services=${json}" >> "$GITHUB_OUTPUT"
          echo "services: ${json}"

  service:
    name: Judge (${{ matrix.service }})
    needs: [build, services]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.services.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-binaries
          path: target/release
      - name: Mark binaries executable
        run: chmod +x target/release/megabase target/release/megabase-judge
      - uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull reference images
        run: |
          set -euo pipefail
          # public.ecr.aws rejects a parallel burst with "toomanyrequests:
          # Rate exceeded". Pull one image at a time and retry.
          mapfile -t images < <(docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example \
            config --images)
          for image in "${images[@]}"; do
            [ -n "$image" ] || continue
            attempt=1
            until docker pull "$image"; do
              if [ "$attempt" -ge 8 ]; then
                echo "failed to pull $image" >&2
                exit 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          done
      - name: Reference stack
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example \
            up -d --pull never --wait --wait-timeout 300
      - name: Prepare Megabase database
        run: ./target/release/megabase-judge prepare
      - name: Megabase on :8100
        run: |
          set -euo pipefail
          JWT_SECRET=$(grep '^JWT_SECRET=' vendor/supabase/docker/.env.example | cut -d= -f2-)
          POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' vendor/supabase/docker/.env.example | cut -d= -f2-)
          # Host :5432 is Supavisor. Direct Postgres is on 54322
          # (judge/compose.override.yml). Dedicated `megabase` database
          # (created by prepare). Sharing the official `postgres`
          # database would make catalog and row comparisons vacuous.
          # `supabase_admin` can run install_schema.
          DATABASE_URL="postgres://supabase_admin:${POSTGRES_PASSWORD}@127.0.0.1:54322/megabase"
          MEGABASE_PORT=8100 MEGABASE_HOST=0.0.0.0 \
            JWT_SECRET="$JWT_SECRET" DATABASE_URL="$DATABASE_URL" \
            ./target/release/megabase > /tmp/megabase.log 2>&1 &
          echo $! > /tmp/megabase.pid
      - name: Wait
        run: ./target/release/megabase-judge wait --timeout 240
      - name: Run cases
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cases
          cp "judge/cases/${SERVICE}.toml" /tmp/cases/
          # Match the harness loader (`[[case]]` / `id`), including ids the
          # line-oriented pattern would miss. An empty table prints `[]`
          # and does not fail the shell, so the check below can report it.
          ids_json=$(python3 - "judge/cases/${SERVICE}.toml" <<'PY'
          import json, sys, tomllib
          path = sys.argv[1]
          with open(path, "rb") as fh:
              doc = tomllib.load(fh)
          cases = doc.get("case", [])
          if not isinstance(cases, list):
              raise SystemExit(f"{path}: case is not an array")
          ids = []
          for index, case in enumerate(cases):
              case_id = case.get("id") if isinstance(case, dict) else None
              if not isinstance(case_id, str) or case_id == "":
                  raise SystemExit(f"{path}: case {index} has no string id")
              ids.append(case_id)
          json.dump(ids, sys.stdout)
          PY
          )
          if [ "$ids_json" = "[]" ]; then
            echo "::error::${SERVICE}.toml has no case ids"
            exit 1
          fi
          # A partial run must not see other services' baseline passes as
          # regressions. Keep only ids from this file.
          if [ -f coverage/judge-results.json ]; then
            jq --argjson ids "$ids_json" \
              '.cases |= map(select(.id as $id | $ids | index($id) != null))' \
              coverage/judge-results.json > /tmp/baseline.json
            baseline=(--baseline /tmp/baseline.json)
          else
            baseline=()
          fi
          ./target/release/megabase-judge run \
            --cases /tmp/cases \
            "${baseline[@]}" \
            --out /tmp/judge-results.json \
            --summary /tmp/judge-summary.md
          cat /tmp/judge-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: vendor/ stayed clean
        run: |
          git -C vendor/supabase status --short
          test -z "$(git -C vendor/supabase status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: judge-results-${{ matrix.service }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            /tmp/judge-results.json
            /tmp/judge-summary.md
            /tmp/megabase.log
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -p megabase-judge \
            -f vendor/supabase/docker/docker-compose.yml \
            -f judge/compose.override.yml \
            --env-file vendor/supabase/docker/.env.example logs --tail 80
          docker inspect --format '{{.State.Status}} {{json .State.Health}}' supabase-pooler || true
          cat /tmp/megabase.log || true

  # Required check name stays `Judge` so branch protection does not change.
  aggregate:
    name: Judge
    needs: [services, service]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: judge-results-*
          path: /tmp/parts
      - name: Merge service results
        id: merge
        run: |
          set -euo pipefail
          discover="${{ needs.services.result }}"
          service="${{ needs.service.result }}"
          echo "discover=${discover} service=${service}"
          shopt -s nullglob
          parts=(/tmp/parts/*/judge-results.json)
          if [ ${#parts[@]} -gt 0 ]; then
            jq -s '{schema: 1, cases: (map(.cases[]) | sort_by(.id))}' "${parts[@]}" > /tmp/judge-results.json
            dup=$(jq -r '[.cases | group_by(.id)[] | select(length > 1) | .[0].id] | .[]' /tmp/judge-results.json)
            if [ -n "$dup" ]; then
              echo "::error::duplicate case ids in merged judge results"
              echo "$dup"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          {
            echo "## Judge"
            echo
            echo "discover=\`${discover}\` service=\`${service}\`"
            echo
            for f in /tmp/parts/*/judge-summary.md; do
              [ -f "$f" ] || continue
              echo "### $(basename "$(dirname "$f")")"
              echo
              cat "$f"
              echo
            done
          } > /tmp/judge-summary.md
          cat /tmp/judge-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$discover" != "success" ] || [ "$service" != "success" ]; then
            echo "::error::One or more judge services failed (discover=${discover}, service=${service})"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ ! -f /tmp/judge-results.json ]; then
            echo "::error::no service produced judge-results.json"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let body = '## Judge\n\n_(no summary)_';
            try {
              body = fs.readFileSync('/tmp/judge-summary.md', 'utf8');
            } catch {
              body += '\n\nCases did not run (reference stack or harness failed first).';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      # pages-badges.yml downloads this artifact from the Judge run.
      # Do not push the file onto main (branch protection, decision 0022).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.merge.outputs.ok == 'true'
        with:
          name: judge-results
          retention-days: 1
          path: |
            /tmp/judge-results.json
            /tmp/judge-summary.md
