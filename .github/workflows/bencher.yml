name: Bencher

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  # Release lockfile sync dispatches this on the release-please branch when
  # GITHUB_TOKEN pushed the lockfile (that push does not start workflows).
  workflow_dispatch:

# Cancel superseded PR runs. Keep main and workflow_dispatch to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Latency uses a percentage test. The gateway HTTP layers add a few
# microseconds (about 3.5–5.4 µs for health and 4.4–6.8 µs for the REST
# stub, against pre-layer means near 1.6 µs and 2.6 µs). A 0.99 t-test
# around that older mean alerts on the stack itself. An upper boundary of
# 3.0 allows up to four times the recent mean and still alerts beyond that.
jobs:
  benchmark:
    name: Bencher
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Fork PRs do not receive repo secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # The current CLI rejects --token / BENCHER_API_TOKEN for API keys.
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
    steps:
      - name: Skip without BENCHER_API_TOKEN
        if: env.BENCHER_API_KEY == ''
        run: echo "BENCHER_API_TOKEN is not set; skipping continuous benchmarking."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.BENCHER_API_KEY != ''
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: env.BENCHER_API_KEY != ''
        with:
          toolchain: stable

      - uses: ./.github/actions/rust-cache
        if: env.BENCHER_API_KEY != ''
        with:
          key: bencher-mold
      - uses: ./.github/actions/linux-mold
        if: env.BENCHER_API_KEY != ''

      - uses: bencherdev/bencher@b4cfdddf418fc547e694b8fa6cc7c846a9c77435 # main
        if: env.BENCHER_API_KEY != ''

      - name: Track benchmarks (main)
        if: env.BENCHER_API_KEY != '' && github.event_name == 'push'
        run: |
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch main \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-upper-boundary 3.0 \
            --error-on-alert \
            "cargo bench --locked --bench health"

      - name: Track benchmarks (pull request)
        if: env.BENCHER_API_KEY != '' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch "$HEAD_REF" \
            --start-point "$BASE_REF" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-upper-boundary 3.0 \
            --error-on-alert \
            --github-actions "$GH_TOKEN" \
            "cargo bench --locked --bench health"

      - name: Track benchmarks (workflow_dispatch)
        if: env.BENCHER_API_KEY != '' && github.event_name == 'workflow_dispatch'
        env:
          HEAD_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse origin/main)"
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch "$HEAD_REF" \
            --start-point main \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-upper-boundary 3.0 \
            --error-on-alert \
            --github-actions "$GH_TOKEN" \
            "cargo bench --locked --bench health"
