name: Bencher

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  # Release lockfile sync dispatches this on the release-please branch when
  # GITHUB_TOKEN pushed the lockfile (that push does not start workflows).
  workflow_dispatch:

# Cancel superseded PR runs. Keep main and workflow_dispatch to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Latency is a percentage boundary on the `latency` measure, which
# `rust_criterion` reports in nanoseconds. Upper boundary `0.75` means the
# limit is 1.75× the mean of the most recent 6 results (the test does not
# run until 6 exist). Pull request #187 had no server change and still
# alerted: health 5.31 µs and REST 6.61 µs against a 0.95 t-test limit of
# 4.79 µs and 6.00 µs, because 12 of those 16 samples were still the
# pre-layer ~1.6 µs results. 1.75× the recent mean passes that runner
# spread and fails a result at twice the recent mean.
# See docs/decisions/0028-bencher-recent-mean-boundary.md.
jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.paths.outputs.site }}
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/pr-paths

  benchmark:
    name: Bencher
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Fork PRs do not receive repo secrets; skip instead of failing.
    # A site-only pull request still runs this job and reports Bencher as
    # success without benchmarking, so the check does not stay pending.
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      # The current CLI rejects --token / BENCHER_API_TOKEN for API keys.
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
    steps:
      - name: Not applicable
        if: needs.changes.outputs.server == 'false'
        run: echo "Site-only pull request. Bencher reports success without benchmarking."

      - name: Skip without BENCHER_API_TOKEN
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY == ''
        run: echo "BENCHER_API_TOKEN is not set; skipping continuous benchmarking."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != ''
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != ''
        with:
          toolchain: stable

      - uses: ./.github/actions/rust-cache
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != ''
        with:
          key: bencher-mold
      - uses: ./.github/actions/linux-mold
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != ''

      - uses: bencherdev/bencher@b4cfdddf418fc547e694b8fa6cc7c846a9c77435 # main
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != ''

      - name: Track benchmarks (main)
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != '' && github.event_name == 'push'
        run: |
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch main \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-min-sample-size 6 \
            --threshold-max-sample-size 6 \
            --threshold-upper-boundary 0.75 \
            --thresholds-reset \
            --error-on-alert \
            "cargo bench --locked --bench health"

      - name: Track benchmarks (pull request)
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != '' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch "$HEAD_REF" \
            --start-point "$BASE_REF" \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-min-sample-size 6 \
            --threshold-max-sample-size 6 \
            --threshold-upper-boundary 0.75 \
            --thresholds-reset \
            --error-on-alert \
            --github-actions "$GH_TOKEN" \
            "cargo bench --locked --bench health"

      - name: Track benchmarks (workflow_dispatch)
        if: needs.changes.outputs.server != 'false' && env.BENCHER_API_KEY != '' && github.event_name == 'workflow_dispatch'
        env:
          HEAD_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse origin/main)"
          bencher run \
            --project megabase \
            --ci-on-the-fly \
            --branch "$HEAD_REF" \
            --start-point main \
            --start-point-hash "$BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed github-actions \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test percentage \
            --threshold-min-sample-size 6 \
            --threshold-max-sample-size 6 \
            --threshold-upper-boundary 0.75 \
            --thresholds-reset \
            --error-on-alert \
            --github-actions "$GH_TOKEN" \
            "cargo bench --locked --bench health"
