# cargo-fuzz targets in fuzz/. OpenSSF Scorecard's Fuzzing check looks for
# `libfuzzer_sys` in *.rs files (checks/raw/fuzzing.go, RustCargoFuzz).
name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    # Longer run than PRs. Offset from Scorecard's Saturday 01:30 cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [jwt, gateway_http, rest_query]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2

      - name: Duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          seconds=60
          case "$EVENT_NAME" in
            pull_request) seconds=60 ;;
            workflow_dispatch)
              if [ -n "$DISPATCH_SECONDS" ] && [ "$DISPATCH_SECONDS" -eq "$DISPATCH_SECONDS" ] 2>/dev/null; then
                seconds="$DISPATCH_SECONDS"
              else
                seconds=600
              fi
              ;;
            *) seconds=600 ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Fuzz ${{ matrix.target }}
        run: |
          # taiki-e/install-action ships a musl cargo-fuzz, which otherwise
          # selects x86_64-unknown-linux-musl. ASan cannot link a static musl
          # libc (rust-fuzz/cargo-fuzz#397 / #398).
          host="$(rustc +nightly -vV | awk '/^host:/{print $2}')"
          cargo +nightly fuzz run "${{ matrix.target }}" --target "$host" -- \
            -max_total_time="${{ steps.duration.outputs.seconds }}"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
