# cargo-fuzz targets in fuzz/. OpenSSF Scorecard's Fuzzing check looks for
# `libfuzzer_sys` in *.rs files (checks/raw/fuzzing.go, RustCargoFuzz).
name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    # Longer run than PRs. Offset from Scorecard's Saturday 01:30 cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Composite actions cannot read secrets or vars. Empty on fork PRs.
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET_NAME: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT_URL: ${{ vars.SCCACHE_ENDPOINT }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.paths.outputs.site }}
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/pr-paths

  fuzz:
    name: cargo-fuzz
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [jwt, gateway_http, rest_query]
    steps:
      - name: Not applicable
        if: needs.changes.result == 'success' && needs.changes.outputs.server == 'false'
        run: echo "Site-only pull request. cargo-fuzz (${{ matrix.target }}) reports success without fuzzing."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        with:
          toolchain: nightly

      - uses: ./.github/actions/sccache
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
      # Registry and git db only. sccache holds compiler outputs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
          cache-targets: "false"

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        with:
          tool: cargo-fuzz@0.13.2

      - name: Duration
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          seconds=60
          case "$EVENT_NAME" in
            pull_request) seconds=60 ;;
            workflow_dispatch)
              if [ -n "$DISPATCH_SECONDS" ] && [ "$DISPATCH_SECONDS" -eq "$DISPATCH_SECONDS" ] 2>/dev/null; then
                seconds="$DISPATCH_SECONDS"
              else
                seconds=600
              fi
              ;;
            *) seconds=600 ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Fuzz ${{ matrix.target }}
        if: needs.changes.result != 'success' || needs.changes.outputs.server != 'false'
        run: |
          # taiki-e/install-action ships a musl cargo-fuzz, which otherwise
          # selects x86_64-unknown-linux-musl. ASan cannot link a static musl
          # libc (rust-fuzz/cargo-fuzz#397 / #398).
          host="$(rustc +nightly -vV | awk '/^host:/{print $2}')"
          cargo +nightly fuzz run "${{ matrix.target }}" --target "$host" -- \
            -max_total_time="${{ steps.duration.outputs.seconds }}"

      - name: Upload crash artifacts
        if: failure() && (needs.changes.result != 'success' || needs.changes.outputs.server != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: sccache stats
        if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server != 'false')
        run: sccache --show-stats
