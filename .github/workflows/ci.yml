name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release lockfile sync dispatches this on the release-please branch when
  # GITHUB_TOKEN pushed the lockfile (that push does not start workflows).
  workflow_dispatch:

# Cancel superseded PR runs. Keep main and workflow_dispatch to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Composite actions cannot read secrets or vars. Empty on fork PRs.
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET_NAME: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT_URL: ${{ vars.SCCACHE_ENDPOINT }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: mold
      - uses: ./.github/actions/linux-mold
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked
      - run: cargo build --release --locked -p megabase -p megabase-judge --bin megabase --bin megabase-healthcheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megabase
          path: |
            target/release/megabase
            target/release/megabase-healthcheck
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d77020bf130f2e8c39c025bf9c4c3a445fe2b9fa # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: mold
      - uses: ./.github/actions/linux-mold
      - run: cargo check --locked -p megabase -p megabase-core -p megabase-server
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  coverage:
    name: Coverage check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: mold
      - uses: ./.github/actions/linux-mold
      - run: cargo run --locked -p megabase-coverage -- verify-pins
      - run: cargo run --locked -p megabase-coverage -- check
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  guard:
    name: Protected paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: mold
      - uses: ./.github/actions/linux-mold
      - name: Policy (docs/adr/0003-protected-paths.md)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          cargo run --locked -p megabase-guard -- \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --head-ref "${HEAD_REF}"
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # cargo-audit is installed as a binary and does not compile the workspace.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Binary install, not cargo-deny-action: that action's image is
      # rust:1.85.0-alpine from Docker Hub and 429s on unauthenticated pulls.
      # --all-features matches that action's default arguments. This job
      # does not build an image; login still runs when the token is set.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check advisories licenses bans sources

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every Cargo.lock we own. vendor/** lockfiles are the frozen
        # upstream spec (ADR 0003) and are not patched here.
        lockfile:
          - Cargo.lock
          - site/Cargo.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      - run: cargo audit --file ${{ matrix.lockfile }}

  # Imported audits (Mozilla, Google, Bytecode Alliance) plus exemptions
  # for everything else. --locked does not fetch new imports.
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked

  # cargo-udeps needs nightly. cargo-machete is the stable check.
  # Paths are ours only; vendor/ is the frozen spec.
  cargo-machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete crates tools judge site fuzz

  # --each-feature rebuilds a crate once per feature. Skip crates that
  # declare none so this stays cheap.
  cargo-hack:
    name: cargo-hack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/sccache
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-hack@0.6.45
      - name: Check each feature of crates that declare one
        run: |
          set -euo pipefail
          meta="$(mktemp)"
          names="$(mktemp)"
          trap 'rm -f "$meta" "$names"' EXIT
          # Direct command so a metadata failure fails the job. A process
          # substitution would hide that status and look like "no features".
          cargo metadata --locked --format-version 1 --no-deps >"$meta"
          python3 -c 'import json,sys
          for p in json.load(open(sys.argv[1]))["packages"]:
              if p.get("features"):
                  print(p["name"])' "$meta" >"$names"
          mapfile -t crates < "$names"
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "No workspace crate declares features; nothing to check."
            exit 0
          fi
          printf 'cargo hack check --each-feature for: %s\n' "${crates[*]}"
          args=()
          for crate in "${crates[@]}"; do
            args+=(-p "$crate")
          done
          cargo hack check --locked --each-feature "${args[@]}"
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  llvm-cov:
    name: Codecov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: ./.github/actions/sccache
      - uses: ./.github/actions/rust-cache
        with:
          key: llvm-cov-mold
      - uses: ./.github/actions/linux-mold
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Install nightly for llvm-cov doctests
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Generate lcov.info
        run: |
          set -euo pipefail
          # --doc and report --doctests need nightly (-Z persist-doctests).
          # Nextest coverage uses that same nightly so one llvm-profdata
          # merges both. The Build job still runs doctests with cargo test --doc.
          cargo +nightly llvm-cov --no-report --workspace --locked nextest
          cargo +nightly llvm-cov --no-report --workspace --locked --doc
          cargo +nightly llvm-cov report --doctests --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.3
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Compiles inside Docker. sccache is not installed in the image:
      # R2 keys would be a second credential path, and fork PRs have none.
      # Runner jobs above use sccache. See docs/decisions/0034-ci-sccache-r2.md.
      - run: docker build -t megabase:ci .
      - run: |
          docker run -d --name megabase-ci -p 8000:8000 megabase:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/_megabase/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs megabase-ci
          exit 1
