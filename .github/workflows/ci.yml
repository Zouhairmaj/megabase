name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p megabase -p megabase-judge --bin megabase --bin megabase-healthcheck
      - uses: actions/upload-artifact@v4
        with:
          name: megabase
          path: |
            target/release/megabase
            target/release/megabase-healthcheck

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked -p megabase -p megabase-core -p megabase-server

  coverage:
    name: Coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - run: cargo run --locked -p megabase-coverage -- verify-pins
      - run: cargo run --locked -p megabase-coverage -- check

  guard:
    name: Protected paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: guard
      - name: Policy (docs/adr/0003-protected-paths.md)
        run: |
          cargo run --locked -p megabase-guard -- \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --head-ref "${{ github.head_ref }}"

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t megabase:ci .
      - run: |
          docker run -d --name megabase-ci -p 8000:8000 megabase:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/_megabase/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs megabase-ci
          exit 1
