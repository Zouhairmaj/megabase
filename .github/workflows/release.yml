name: Release

on:
  push:
    branches: [main]
  # Backfill artifacts on an existing tag (v0.1.0 shipped without binaries).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to sign and publish. Use workflow from must be this same tag (attest-build-provenance records the run SHA).
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # bootstrap-sha is the Phase 0 merge (7aa41e8, exclusive). Commits
      # before it use [phase0]/[brand]/Day 0 subjects that
      # conventional-commits-parser rejects. Those are warnings, not
      # release-please failures; skipping them keeps the log clean. The
      # job still fails on real errors (config, permissions, API).
      #
      # RELEASE_PLEASE_TOKEN is preferred: a PAT or GitHub App token that
      # can create PRs and whose pushes start workflows. GITHUB_TOKEN can
      # create PRs when the Actions setting is enabled, but a GITHUB_TOKEN
      # push still does not trigger push/pull_request workflows. The
      # lockfile job then workflow_dispatches required checks onto that
      # SHA (see sync-lockfile).
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  sync-lockfile:
    name: Sync Cargo.lock
    needs: release-please
    if: ${{ github.event_name == 'push' && always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout the release-please branch
        id: branch
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release-please--branches--*:refs/remotes/origin/release-please--branches--*'
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-please--branches--*' | sed 's#^origin/##')
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release-please branch on origin."
            exit 0
          fi
          BRANCH="${BRANCHES[0]}"
          for b in "${BRANCHES[@]}"; do
            if [[ "$b" == *megabase* ]]; then
              BRANCH="$b"
              break
            fi
          done
          git checkout --track "origin/${BRANCH}"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.branch.outputs.exists == 'true'
        with:
          toolchain: stable
      - name: Match lockfile workspace versions
        if: steps.branch.outputs.exists == 'true'
        run: cargo update -w
      - name: Commit Cargo.lock if it changed
        id: commit
        if: steps.branch.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches workspace versions."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync Cargo.lock with workspace version"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Confirm required checks started on the lockfile head
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HAS_RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCKFILE_CHECK_ATTEMPTS: 60
          LOCKFILE_CHECK_SLEEP_SECONDS: 6
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          REQUIRED='["Build","Codecov","Bencher","Protected paths","Judge"]'
          ATTEMPTS="${LOCKFILE_CHECK_ATTEMPTS:-60}"
          SLEEP_SECS="${LOCKFILE_CHECK_SLEEP_SECONDS:-6}"

          missing_required() {
            local CHECK_RUNS
            CHECK_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
            jq -r --argjson required "${REQUIRED}" '
              [.check_runs[].name] as $started
              | $required - $started
              | join(", ")
            ' <<< "${CHECK_RUNS}"
          }

          if [ -z "$(missing_required)" ]; then
            echo "Required checks already started on ${SHA}."
            exit 0
          fi

          # GITHUB_TOKEN may not start push/pull_request workflows, but it
          # can create workflow_dispatch runs. Prefer dispatching CI, Bencher,
          # and Judge on the release branch (native checks on this SHA). If
          # that ref's workflow files lack workflow_dispatch, fall back to
          # Lockfile required checks on the default branch, which reports
          # the same check names onto this SHA via the Checks API.
          # Dispatch whenever checks are missing, including a rerun after
          # RELEASE_PLEASE_TOKEN is set but the existing head was pushed
          # with GITHUB_TOKEN (no new lockfile commit).
          if [ "${HAS_RELEASE_PLEASE_TOKEN}" != "true" ] || [ "${PUSHED:-false}" != "true" ]; then
            echo "Required checks missing on ${SHA}; dispatching (RELEASE_PLEASE_TOKEN=${HAS_RELEASE_PLEASE_TOKEN} pushed=${PUSHED:-false})"
            if gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run bencher.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run judge.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"; then
              echo "Dispatched CI, Bencher, and Judge on ${BRANCH} (head ${SHA})"
            else
              echo "workflow_dispatch on ${BRANCH} failed or is unavailable; dispatching Lockfile required checks on ${DEFAULT_BRANCH} for ${SHA}"
              gh workflow run lockfile-required-checks.yml --repo "${GITHUB_REPOSITORY}" --ref "${DEFAULT_BRANCH}" \
                -f "sha=${SHA}" -f "branch=${BRANCH}"
            fi
          fi

          echo "Waiting for required check runs on ${SHA} (${BRANCH}): ${REQUIRED} (${ATTEMPTS} attempts, ${SLEEP_SECS}s)"
          for i in $(seq 1 "${ATTEMPTS}"); do
            CHECK_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
            COUNT="$(jq '.total_count' <<< "${CHECK_RUNS}")"
            MISSING="$(jq -r --argjson required "${REQUIRED}" '
              [.check_runs[].name] as $started
              | $required - $started
              | join(", ")
            ' <<< "${CHECK_RUNS}")"
            echo "attempt ${i}/${ATTEMPTS}: ${COUNT} check runs; missing required: ${MISSING:-none}"
            if [ -z "${MISSING}" ]; then
              jq '.check_runs | map(.name)' <<< "${CHECK_RUNS}"
              exit 0
            fi
            sleep "${SLEEP_SECS}"
          done
          echo "::error::Required checks did not start for ${SHA} (need Build, Codecov, Bencher, Protected paths, Judge). A GITHUB_TOKEN push does not trigger push/pull_request workflows. The job dispatches CI/Bencher/Judge or Lockfile required checks; if that also failed, set repo secret RELEASE_PLEASE_TOKEN (PAT or GitHub App installation token with contents:write). Exact steps are in HUMAN_LOG.md."
          exit 1

  annotate-release:
    name: Coverage delta on release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Append coverage and conformance delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          sumline() {
            local file="$1" label="$2"
            jq -r --arg l "$label" '
              "- \($l): coverage \(.percent.coverage)% (\(.totals.implemented)/\(.totals.units) units implemented), conformance \(.percent.conformance)% (\(.judge.passing)/\(.judge.cases) judge cases)"
            ' "$file"
          }
          git show "${TAG}:coverage/summary.json" > /tmp/cur.json
          {
            echo
            echo "## Coverage and conformance"
            echo
            sumline /tmp/cur.json "This release"
            PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')"
            if [ -n "${PREV:-}" ] && git cat-file -e "${PREV}:coverage/summary.json" 2>/dev/null; then
              git show "${PREV}:coverage/summary.json" > /tmp/prev.json
              sumline /tmp/prev.json "Previous release (\`${PREV}\`)"
              jq -s -r '
                "- Delta: coverage \((.[0].percent.coverage - .[1].percent.coverage) | tostring) pp, conformance \((.[0].percent.conformance - .[1].percent.conformance) | tostring) pp"
              ' /tmp/cur.json /tmp/prev.json
            else
              echo "- Initial release (no previous tag)."
            fi
          } > /tmp/delta.md
          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          cat /tmp/delta.md >> /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

  # OpenSSF Scorecard Packaging + Signed-Releases: attach musl-static linux
  # binaries, SHA256SUMS, cosign keyless .sig/.pem, SLSA .intoto.jsonl, and
  # publish a version-tagged image to ghcr.io/zouhairmaj/megabase (cosign).
  # id-token: write stays on sign-and-publish only.
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
      - name: Build static megabase
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}" -p megabase --bin megabase
          BIN="target/${TARGET}/release/megabase"
          info="$(file "${BIN}")"
          echo "${info}"
          if echo "${info}" | grep -qi 'dynamically linked'; then
            echo "::error::${BIN} is dynamically linked; expected musl-static"
            ldd "${BIN}" || true
            exit 1
          fi
          if ! echo "${info}" | grep -qiE 'static'; then
            echo "::error::${BIN} is not statically linked (musl static required)"
            exit 1
          fi
          strip "${BIN}" || true
          mkdir -p dist
          ASSET="megabase-${TAG}-${TARGET}"
          cp "${BIN}" "dist/${ASSET}"
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megabase-binary-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 5

  sign-and-publish:
    name: Sign and publish
    needs: [release-please, build-binaries]
    if: always() && !cancelled() && needs.build-binaries.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      IMAGE: ghcr.io/zouhairmaj/megabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: megabase-binary-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum megabase-* > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign blobs (Sigstore keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in megabase-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
      - name: SLSA provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach provenance as .intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "dist/megabase-${TAG}.intoto.jsonl"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* --clobber
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version without v prefix
        id: version
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
