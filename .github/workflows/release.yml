name: Release

on:
  push:
    branches: [main]
  # Backfill artifacts on an existing tag (v0.1.0 shipped without binaries).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to sign and publish. Use workflow from must be this same tag (attest-build-provenance records the run SHA).
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # CreatedRelease.sha (GitHub target_commitish). Full commit SHA
      # when the release API echoes the SHA passed to createRelease.
      sha: ${{ steps.release.outputs.sha }}
      # tree-token source: release (probe succeeded) or github (403/404 fallback).
      token_source: ${{ steps.tree-token.outputs.source }}
    steps:
      # bootstrap-sha is the Phase 0 merge (7aa41e8, exclusive). Commits
      # before it use [phase0]/[brand]/Day 0 subjects that
      # conventional-commits-parser rejects. Those are warnings, not
      # release-please failures; skipping them keeps the log clean. The
      # job still fails on real errors (config, permissions, API).
      #
      # RELEASE_PLEASE_TOKEN is preferred when its tree probe succeeds:
      # a user or GitHub App push starts workflows; GITHUB_TOKEN does not.
      # The lockfile job uses this step's source output as token_source
      # and dispatches required checks when the push does not use the
      # secret (see sync-lockfile). Required secret permissions are
      # in PROGRESS.md (Human-only actions).
      #
      # The probe POSTs /git/trees with an unreferenced tree (a "probe"
      # blob on .release-please-manifest.json, not attached to a commit
      # or branch; GitHub garbage-collects it). Only HTTP 403 and 404
      # from that call fall back to FALLBACK_TOKEN. Rate limits and 5xx
      # fail the job so a transient error is not treated as missing scopes.
      # GH_TOKEN is the credential for the base-tree read. release-please
      # otherwise hides the GitHub status as "Error adding to tree".
      - name: Choose a token that can create a git tree
        id: tree-token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tree_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.tree.sha)"
          last_probe=""
          last_http=""
          http_status_from() {
            local text="$1" code
            code="$(printf '%s\n' "$text" | sed -n 's/.*HTTP \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)"
            if [ -n "$code" ]; then
              printf '%s' "$code"
              return 0
            fi
            printf '%s\n' "$text" | sed -n 's/.*"status": *"\([0-9][0-9][0-9]\)".*/\1/p' | head -n 1
          }
          can_create_tree() {
            local token="$1"
            local out code
            set +e
            out="$(GH_TOKEN="$token" gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
              -f "base_tree=${tree_sha}" \
              -f 'tree[][path]=.release-please-manifest.json' \
              -f 'tree[][mode]=100644' \
              -f 'tree[][type]=blob' \
              -f 'tree[][content]=probe' 2>&1)"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              last_probe=""
              last_http="201"
              return 0
            fi
            last_probe="$(printf '%s' "$out" | tr '\n' ' ' | cut -c1-500)"
            last_http="$(http_status_from "$last_probe")"
            return 1
          }
          auth_denial() {
            case "$last_probe" in
              *[Rr]ate\ limit*|*[Rr]ate-limit*) return 1 ;;
            esac
            case "$last_http" in
              403|404) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ -n "${RELEASE_TOKEN}" ] && can_create_tree "${RELEASE_TOKEN}"; then
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "RELEASE_PLEASE_TOKEN can create a git tree."
            exit 0
          fi
          if [ -n "${RELEASE_TOKEN}" ]; then
            if ! auth_denial; then
              echo "::error::RELEASE_PLEASE_TOKEN tree probe failed with HTTP ${last_http:-unknown}. This job falls back only for HTTP 403 or 404 that is not a rate limit, so this response is left to retry. GitHub response: ${last_probe}. Permissions: PROGRESS.md Human-only actions."
              exit 1
            fi
            echo "::warning::RELEASE_PLEASE_TOKEN cannot create a git tree (HTTP ${last_http}; release-please would report Error adding to tree: ${GITHUB_SHA}). Falling back to GITHUB_TOKEN for this job. If this secret is megabase-agent's fine-grained PAT, GitHub does not allow it to write a public repository owned by another personal account, even for a collaborator. Replace it with a classic PAT (scopes repo and workflow). Pending: PROGRESS.md Human-only actions and HUMAN_LOG.md. GitHub response: ${last_probe}"
          fi
          if can_create_tree "${FALLBACK_TOKEN}"; then
            echo "source=github" >> "$GITHUB_OUTPUT"
            echo "GITHUB_TOKEN can create a git tree."
            exit 0
          fi
          echo "::error::GITHUB_TOKEN cannot create a git tree on ${GITHUB_SHA} (HTTP ${last_http:-unknown}). The release-please job needs permissions contents: write. GitHub response: ${last_probe}. Permissions: PROGRESS.md Human-only actions."
          exit 1
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.tree-token.outputs.source == 'release' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  sync-lockfile:
    name: Sync Cargo.lock
    needs: release-please
    if: ${{ github.event_name == 'push' && always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
      pull-requests: read
    steps:
      # Same credential the tree probe selected. RELEASE_PLEASE_TOKEN
      # authenticates as megabase-agent. A fine-grained PAT from that
      # account cannot write this repository (owned by another user),
      # so runs 38007606007 and 38008795223 got HTTP 403
      # "Permission to Zouhairmaj/megabase.git denied to megabase-agent".
      # Do not keep that identity. GITHUB_TOKEN on this job has
      # contents: write. It does not start push workflows, so the
      # confirm step dispatches checks unless the push used a release
      # token that GitHub actually accepted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ needs.release-please.outputs.token_source == 'release' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout the release-please branch
        id: branch
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release-please--branches--*:refs/remotes/origin/release-please--branches--*'
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-please--branches--*' | sed 's#^origin/##')
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release-please branch on origin."
            exit 0
          fi
          BRANCH="${BRANCHES[0]}"
          for b in "${BRANCHES[@]}"; do
            if [[ "$b" == *megabase* ]]; then
              BRANCH="$b"
              break
            fi
          done
          git checkout --track "origin/${BRANCH}"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.branch.outputs.exists == 'true'
        with:
          toolchain: stable
      - name: Match lockfile workspace versions
        if: steps.branch.outputs.exists == 'true'
        run: cargo update -w
      - name: Commit Cargo.lock if it changed
        id: commit
        if: steps.branch.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TOKEN_SOURCE: ${{ needs.release-please.outputs.token_source }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches workspace versions."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync Cargo.lock with workspace version"
          # A fine-grained PAT owned by megabase-agent is denied on this
          # ref (runs 38007606007 and 38008795223). Retry that 403 with
          # the job GITHUB_TOKEN, which has contents: write. Leave other
          # push failures alone.
          set +e
          push_out="$(git push origin "HEAD:refs/heads/${BRANCH}" 2>&1)"
          push_code=$?
          set -e
          printf '%s\n' "$push_out"
          pushed_with="${TOKEN_SOURCE:-github}"
          if [ "$push_code" -ne 0 ]; then
            if ! printf '%s\n' "$push_out" | grep -Eq '403|Permission to .+ denied'; then
              exit "$push_code"
            fi
            echo "Push denied for the checkout token; retrying with GITHUB_TOKEN (contents: write)."
            if printf '%s\n' "$push_out" | grep -q 'denied to megabase-agent'; then
              echo "::error::RELEASE_PLEASE_TOKEN authenticated as megabase-agent and git push was denied (HTTP 403). That secret is a fine-grained PAT. Fine-grained PATs cannot write a public repository owned by another personal account, even for a collaborator (https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens). Replace it with a classic PAT that can write ${GITHUB_REPOSITORY}, scopes repo and workflow. Granting Contents write on the fine-grained token does not remove this limit. Pending: PROGRESS.md Human-only actions and HUMAN_LOG.md. Retrying with GITHUB_TOKEN (contents: write); that push does not start workflows."
            fi
            # actions/checkout stores AUTHORIZATION in
            # http.https://github.com/.extraheader. Replacing origin does
            # not remove that header, so the denied token would still be
            # sent. Drop it, then authenticate the retry with GH_TOKEN only.
            git config --local --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${BRANCH}"
            pushed_with="github"
          elif [ "$pushed_with" != "release" ]; then
            pushed_with="github"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_with=${pushed_with}" >> "$GITHUB_OUTPUT"
      - name: Confirm required checks started on the lockfile head
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TOKEN_SOURCE: ${{ needs.release-please.outputs.token_source }}
          PUSHED_WITH: ${{ steps.commit.outputs.pushed_with }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCKFILE_CHECK_ATTEMPTS: 180
          LOCKFILE_CHECK_SLEEP_SECONDS: 6
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          # Judge is satisfied by the aggregate name or by any matrix job
          # `Judge (<service>)`. The aggregate starts only after those jobs
          # finish (judge.yml), which is later than this wait. `Judge build`
          # and `Judge services` do not count. Lockfile required checks
          # still posts a check named exactly `Judge`.
          REQUIRED='["Build","Codecov","Bencher","Protected paths","Judge"]'
          ATTEMPTS="${LOCKFILE_CHECK_ATTEMPTS:-180}"
          SLEEP_SECS="${LOCKFILE_CHECK_SLEEP_SECONDS:-6}"

          read_checks() {
            CHECK_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
            COUNT="$(jq '.total_count' <<< "${CHECK_RUNS}")"
            MISSING="$(jq -r --argjson required "${REQUIRED}" '
              [.check_runs[].name] as $started
              | [
                  $required[] as $name
                  | if $name == "Judge" then
                      if any($started[]; . == "Judge" or startswith("Judge (")) then
                        empty
                      else
                        $name
                      end
                    elif any($started[]; . == $name) then
                      empty
                    else
                      $name
                    end
                ]
              | join(", ")
            ' <<< "${CHECK_RUNS}")"
          }

          read_checks
          if [ -z "${MISSING}" ]; then
            echo "Required checks already started on ${SHA}."
            exit 0
          fi

          # GITHUB_TOKEN may not start push/pull_request workflows, but it
          # can create workflow_dispatch runs. Prefer dispatching CI, Bencher,
          # and Judge on the release branch (native checks on this SHA). If
          # that ref's workflow files lack workflow_dispatch, fall back to
          # Lockfile required checks on the default branch, which reports
          # the same check names onto this SHA via the Checks API.
          # Dispatch whenever checks are missing. A release-token push
          # starts push workflows only on the default branch: ci.yml,
          # bencher.yml, and judge.yml listen for push on main. The
          # lockfile commit is on release-please--branches--*, so skip
          # dispatch only when that push used the release token and
          # BRANCH is the default branch. pushed_with is github when
          # the probe fell back or a 403 retry used GITHUB_TOKEN
          # (megabase-agent). Also dispatch when this step did not push.
          if [ "${PUSHED_WITH:-${TOKEN_SOURCE}}" != "release" ] || [ "${PUSHED:-false}" != "true" ] || [ "${BRANCH}" != "${DEFAULT_BRANCH}" ]; then
            echo "Required checks missing on ${SHA}; dispatching (pushed_with=${PUSHED_WITH:-unset} token_source=${TOKEN_SOURCE:-unset} pushed=${PUSHED:-false} branch=${BRANCH} default=${DEFAULT_BRANCH})"
            if gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run bencher.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run judge.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"; then
              echo "Dispatched CI, Bencher, and Judge on ${BRANCH} (head ${SHA})"
            else
              echo "workflow_dispatch on ${BRANCH} failed or is unavailable; dispatching Lockfile required checks on ${DEFAULT_BRANCH} for ${SHA}"
              gh workflow run lockfile-required-checks.yml --repo "${GITHUB_REPOSITORY}" --ref "${DEFAULT_BRANCH}" \
                -f "sha=${SHA}" -f "branch=${BRANCH}"
            fi
          fi

          echo "Waiting for required check runs on ${SHA} (${BRANCH}): ${REQUIRED} (Judge also accepts Judge (…) matrix jobs; ${ATTEMPTS} attempts, ${SLEEP_SECS}s)"
          for i in $(seq 1 "${ATTEMPTS}"); do
            read_checks
            echo "attempt ${i}/${ATTEMPTS}: ${COUNT} check runs; missing required: ${MISSING:-none}"
            if [ -z "${MISSING}" ]; then
              jq '.check_runs | map(.name)' <<< "${CHECK_RUNS}"
              exit 0
            fi
            sleep "${SLEEP_SECS}"
          done
          echo "::error::Required checks did not start for ${SHA} (need Build, Codecov, Bencher, Protected paths, and Judge or a Judge (…) matrix job). A GITHUB_TOKEN push does not trigger push/pull_request workflows. The job dispatches CI/Bencher/Judge or Lockfile required checks; if that also failed, set RELEASE_PLEASE_TOKEN to a classic PAT (repo and workflow scopes) as described under Human-only actions in PROGRESS.md. A fine-grained PAT cannot write this public user-owned repository."
          exit 1

  annotate-release:
    name: Coverage delta on release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Append coverage and conformance delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          sumline() {
            local file="$1" label="$2"
            jq -r --arg l "$label" '
              "- \($l): coverage \(.percent.coverage)% (\(.totals.implemented)/\(.totals.units) units implemented), conformance \(.percent.conformance)% (\(.judge.passing)/\(.judge.cases) judge cases)"
            ' "$file"
          }
          git show "${TAG}:coverage/summary.json" > /tmp/cur.json
          {
            echo
            echo "## Coverage and conformance"
            echo
            sumline /tmp/cur.json "This release"
            PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')"
            if [ -n "${PREV:-}" ] && git cat-file -e "${PREV}:coverage/summary.json" 2>/dev/null; then
              git show "${PREV}:coverage/summary.json" > /tmp/prev.json
              sumline /tmp/prev.json "Previous release (\`${PREV}\`)"
              jq -s -r '
                "- Delta: coverage \((.[0].percent.coverage - .[1].percent.coverage) | tostring) pp, conformance \((.[0].percent.conformance - .[1].percent.conformance) | tostring) pp"
              ' /tmp/cur.json /tmp/prev.json
            else
              echo "- Initial release (no previous tag)."
            fi
          } > /tmp/delta.md
          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          cat /tmp/delta.md >> /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

  # OpenSSF Scorecard Packaging + Signed-Releases: attach musl-static linux
  # binaries, SHA256SUMS, cosign keyless .sig/.pem, SLSA .intoto.jsonl, and
  # publish a version-tagged image to ghcr.io/zouhairmaj/megabase (cosign).
  # id-token: write stays on sign-and-publish only.
  # Push builds run only when this commit is the release tag.
  # attest-build-provenance records GITHUB_SHA. release-please can set
  # release_created for an older tag on a later push (run 38007606007
  # published v0.1.1 at ff54751 while this run was a3a1300); those
  # builds must skip, not fail the SHA check. workflow_dispatch still
  # runs, and the SHA check step requires Use workflow from = the tag.
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.sha == github.sha))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: release-${{ matrix.target }}
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
      - name: Build static megabase
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}" -p megabase --bin megabase
          BIN="target/${TARGET}/release/megabase"
          info="$(file "${BIN}")"
          echo "${info}"
          if echo "${info}" | grep -qi 'dynamically linked'; then
            echo "::error::${BIN} is dynamically linked; expected musl-static"
            ldd "${BIN}" || true
            exit 1
          fi
          if ! echo "${info}" | grep -qiE 'static'; then
            echo "::error::${BIN} is not statically linked (musl static required)"
            exit 1
          fi
          strip "${BIN}" || true
          mkdir -p dist
          ASSET="megabase-${TAG}-${TARGET}"
          cp "${BIN}" "dist/${ASSET}"
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megabase-binary-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 5

  sign-and-publish:
    name: Sign and publish
    needs: [release-please, build-binaries]
    if: always() && !cancelled() && needs.build-binaries.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      IMAGE: ghcr.io/zouhairmaj/megabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: megabase-binary-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum megabase-* > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign blobs (Sigstore keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in megabase-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
      - name: SLSA provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach provenance as .intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "dist/megabase-${TAG}.intoto.jsonl"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* --clobber
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version without v prefix
        id: version
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
