name: Release

on:
  push:
    branches: [main]
  # Backfill artifacts on an existing tag (v0.1.0 shipped without binaries).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to sign and publish. Use workflow from must be this same tag (attest-build-provenance records the run SHA).
        required: true
        type: string

permissions:
  contents: read

# One Release run at a time. Overlapping runs still race inside a single
# job: release-please caches the `main` tree by branch name, then commits
# onto a newer SHA. The lockfile job repairs that. Queuing only stops two
# runs from pushing the release branch at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # CreatedRelease.sha (GitHub target_commitish). Full commit SHA
      # when the release API echoes the SHA passed to createRelease.
      sha: ${{ steps.release.outputs.sha }}
      # tree-token source: release (probe succeeded) or github (403/404 fallback).
      token_source: ${{ steps.tree-token.outputs.source }}
    steps:
      # bootstrap-sha is the Phase 0 merge (7aa41e8, exclusive). Commits
      # before it use [phase0]/[brand]/Day 0 subjects that
      # conventional-commits-parser rejects. Those are warnings, not
      # release-please failures; skipping them keeps the log clean. The
      # job still fails on real errors (config, permissions, API).
      #
      # RELEASE_PLEASE_CLASSIC_TOKEN is preferred (classic PAT, repo and
      # workflow). A push with that credential starts workflows.
      # If it is absent, the probe tries RELEASE_PLEASE_TOKEN, then
      # GITHUB_TOKEN. GITHUB_TOKEN does not start push or pull_request
      # workflows. The lockfile job uses this step's source output
      # (classic, release, or github) as token_source.
      #
      # The probe POSTs /git/trees with an unreferenced tree (a "probe"
      # blob on .release-please-manifest.json, not attached to a commit
      # or branch; GitHub garbage-collects it). Only HTTP 403 and 404
      # from that call fall back to FALLBACK_TOKEN. Rate limits and 5xx
      # fail the job so a transient error is not treated as missing scopes.
      # GH_TOKEN is the credential for the base-tree read. release-please
      # otherwise hides the GitHub status as "Error adding to tree".
      - name: Choose a token that can create a git tree
        id: tree-token
        env:
          CLASSIC_TOKEN: ${{ secrets.RELEASE_PLEASE_CLASSIC_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tree_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.tree.sha)"
          last_probe=""
          last_http=""
          http_status_from() {
            local text="$1" code
            code="$(printf '%s\n' "$text" | sed -n 's/.*HTTP \([0-9][0-9][0-9]\).*/\1/p' | tail -n 1)"
            if [ -n "$code" ]; then
              printf '%s' "$code"
              return 0
            fi
            printf '%s\n' "$text" | sed -n 's/.*"status": *"\([0-9][0-9][0-9]\)".*/\1/p' | head -n 1
          }
          can_create_tree() {
            local token="$1"
            local out code
            set +e
            out="$(GH_TOKEN="$token" gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
              -f "base_tree=${tree_sha}" \
              -f 'tree[][path]=.release-please-manifest.json' \
              -f 'tree[][mode]=100644' \
              -f 'tree[][type]=blob' \
              -f 'tree[][content]=probe' 2>&1)"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              last_probe=""
              last_http="201"
              return 0
            fi
            last_probe="$(printf '%s' "$out" | tr '\n' ' ' | cut -c1-500)"
            last_http="$(http_status_from "$last_probe")"
            return 1
          }
          auth_denial() {
            case "$last_probe" in
              *[Rr]ate\ limit*|*[Rr]ate-limit*) return 1 ;;
            esac
            case "$last_http" in
              403|404) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Absent means unset or empty. A present token that is denied
          # (HTTP 403 or 404, not a rate limit) falls through. Any other
          # probe failure is retried by failing the job.
          try_token() {
            local name="$1" token="$2" source_name="$3"
            if [ -z "${token}" ]; then
              echo "${name} is absent."
              return 1
            fi
            if can_create_tree "${token}"; then
              echo "source=${source_name}" >> "$GITHUB_OUTPUT"
              echo "${name} can create a git tree."
              return 0
            fi
            if ! auth_denial; then
              echo "::error::${name} tree probe failed with HTTP ${last_http:-unknown}. This job falls back only for HTTP 403 or 404 that is not a rate limit, so this response is left to retry. GitHub response: ${last_probe}."
              exit 1
            fi
            echo "::warning::${name} cannot create a git tree (HTTP ${last_http}; release-please would report Error adding to tree: ${GITHUB_SHA}). Trying the next credential. GitHub response: ${last_probe}"
            return 1
          }
          if try_token "RELEASE_PLEASE_CLASSIC_TOKEN" "${CLASSIC_TOKEN}" "classic" \
            || try_token "RELEASE_PLEASE_TOKEN" "${RELEASE_TOKEN}" "release" \
            || try_token "GITHUB_TOKEN" "${FALLBACK_TOKEN}" "github"; then
            exit 0
          fi
          echo "::error::No token can create a git tree on ${GITHUB_SHA} (HTTP ${last_http:-unknown}). Tried RELEASE_PLEASE_CLASSIC_TOKEN, RELEASE_PLEASE_TOKEN, and GITHUB_TOKEN. The release-please job needs permissions contents: write. GitHub response: ${last_probe}."
          exit 1
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.tree-token.outputs.source == 'classic' && secrets.RELEASE_PLEASE_CLASSIC_TOKEN || steps.tree-token.outputs.source == 'release' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  sync-lockfile:
    name: Sync Cargo.lock
    needs: release-please
    if: ${{ github.event_name == 'push' && always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
      pull-requests: read
    steps:
      # Same credential the tree probe selected.
      # RELEASE_PLEASE_CLASSIC_TOKEN is a classic PAT (repo and workflow);
      # its push to the release branch starts pull_request workflows.
      # RELEASE_PLEASE_TOKEN is the previous fine-grained PAT. The probe
      # uses it when the classic secret is absent, or when a present
      # classic token gets HTTP 403 or 404 that is not a rate limit.
      # GITHUB_TOKEN has contents: write and does not start those workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ needs.release-please.outputs.token_source == 'classic' && secrets.RELEASE_PLEASE_CLASSIC_TOKEN || needs.release-please.outputs.token_source == 'release' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout the release-please branch
        id: branch
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release-please--branches--*:refs/remotes/origin/release-please--branches--*'
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-please--branches--*' | sed 's#^origin/##')
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release-please branch on origin."
            exit 0
          fi
          BRANCH="${BRANCHES[0]}"
          for b in "${BRANCHES[@]}"; do
            if [[ "$b" == *megabase* ]]; then
              BRANCH="$b"
              break
            fi
          done
          git checkout --track "origin/${BRANCH}"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.branch.outputs.exists == 'true'
        with:
          toolchain: stable
      # release-please 17.3.0 caches git trees in RepositoryFileCache under
      # the branch name `main`, not the SHA. Run 38031312690 fetched that
      # tree at 06:32:55Z (main was still 434cc3d / 2d9df9a), then created
      # e80025f with parent 846b842. The cached Cargo.toml became the file
      # on the new tree and deleted chacha20 and hkdf. replaceTomlValue
      # only rewrites the version span; the deletion is the stale file.
      # Rebuild Cargo.toml from the merge-base (the parent main actually
      # committed onto) and change only [workspace.package] version.
      - name: Restore Cargo.toml and bump the workspace version
        if: steps.branch.outputs.exists == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          BASE="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
          VERSION="$(jq -er '.["."]' .release-please-manifest.json)"
          case "${VERSION}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::.release-please-manifest.json version is not a dotted number: ${VERSION}"
              exit 1
              ;;
          esac
          git show "${BASE}:Cargo.toml" > Cargo.toml.base
          awk -v ver="${VERSION}" '
            BEGIN { in_pkg = 0; done = 0 }
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && !done && /^version[[:space:]]*=[[:space:]]*"/ {
              sub(/"[^"]*"/, "\"" ver "\"")
              done = 1
            }
            { print }
          ' Cargo.toml.base > Cargo.toml
          if ! awk -v ver="${VERSION}" '
            BEGIN { in_pkg = 0; found = 0 }
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && index($0, "version = \"" ver "\"") == 1 { found = 1 }
            END { exit found ? 0 : 1 }
          ' Cargo.toml; then
            echo "::error::[workspace.package] version was not set to ${VERSION} (base ${BASE})"
            exit 1
          fi
          mask() {
            awk '
              BEGIN { in_pkg = 0; done = 0 }
              /^\[/ { in_pkg = ($0 == "[workspace.package]") }
              in_pkg && !done && /^version[[:space:]]*=[[:space:]]*"/ {
                sub(/"[^"]*"/, "\"0.0.0\"")
                done = 1
              }
              { print }
            ' "$1"
          }
          if ! cmp -s <(mask Cargo.toml.base) <(mask Cargo.toml); then
            echo "::error::restored Cargo.toml is not a version bump of ${BASE}"
            exit 1
          fi
          rm Cargo.toml.base
      - name: Match lockfile workspace versions
        if: steps.branch.outputs.exists == 'true'
        run: cargo update -w
      - name: Commit Cargo.toml and Cargo.lock if they changed
        id: commit
        if: steps.branch.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TOKEN_SOURCE: ${{ needs.release-please.outputs.token_source }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.toml and Cargo.lock already match the workspace version."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync workspace version into Cargo.toml and Cargo.lock"
          # A fine-grained PAT owned by megabase-agent is denied on this
          # ref (runs 38007606007 and 38008795223). Retry that 403 with
          # the job GITHUB_TOKEN, which has contents: write. Leave other
          # push failures alone.
          set +e
          push_out="$(git push origin "HEAD:refs/heads/${BRANCH}" 2>&1)"
          push_code=$?
          set -e
          printf '%s\n' "$push_out"
          pushed_with="${TOKEN_SOURCE:-github}"
          if [ "$push_code" -ne 0 ]; then
            if ! printf '%s\n' "$push_out" | grep -Eq '403|Permission to .+ denied'; then
              exit "$push_code"
            fi
            echo "Push denied for the checkout token; retrying with GITHUB_TOKEN (contents: write)."
            if printf '%s\n' "$push_out" | grep -q 'denied to megabase-agent'; then
              echo "::error::The checkout token authenticated as megabase-agent and git push was denied (HTTP 403). A fine-grained PAT cannot write a public repository owned by another personal account. RELEASE_PLEASE_CLASSIC_TOKEN is the classic PAT (repo and workflow) this job prefers. Retrying with GITHUB_TOKEN (contents: write); that push does not start workflows."
            fi
            # actions/checkout stores AUTHORIZATION in
            # http.https://github.com/.extraheader. Replacing origin does
            # not remove that header, so the denied token would still be
            # sent. Drop it, then authenticate the retry with GH_TOKEN only.
            git config --local --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${BRANCH}"
            pushed_with="github"
          elif [ "$pushed_with" != "release" ] && [ "$pushed_with" != "classic" ]; then
            pushed_with="github"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "pushed_with=${pushed_with}" >> "$GITHUB_OUTPUT"
      - name: Confirm required checks started on the lockfile head
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TOKEN_SOURCE: ${{ needs.release-please.outputs.token_source }}
          PUSHED_WITH: ${{ steps.commit.outputs.pushed_with }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCKFILE_CHECK_ATTEMPTS: 180
          LOCKFILE_CHECK_SLEEP_SECONDS: 6
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          # Judge is satisfied by the aggregate name or by any matrix job
          # `Judge (<service>)`. The aggregate starts only after those jobs
          # finish (judge.yml), which is later than this wait. `Judge build`
          # and `Judge services` do not count. Lockfile required checks
          # still posts a check named exactly `Judge`.
          REQUIRED='["Build","Codecov","Bencher","Protected paths","Judge"]'
          ATTEMPTS="${LOCKFILE_CHECK_ATTEMPTS:-180}"
          SLEEP_SECS="${LOCKFILE_CHECK_SLEEP_SECONDS:-6}"

          read_checks() {
            CHECK_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
            COUNT="$(jq '.total_count' <<< "${CHECK_RUNS}")"
            MISSING="$(jq -r --argjson required "${REQUIRED}" '
              [.check_runs[].name] as $started
              | [
                  $required[] as $name
                  | if $name == "Judge" then
                      if any($started[]; . == "Judge" or startswith("Judge (")) then
                        empty
                      else
                        $name
                      end
                    elif any($started[]; . == $name) then
                      empty
                    else
                      $name
                    end
                ]
              | join(", ")
            ' <<< "${CHECK_RUNS}")"
          }

          read_checks
          if [ -z "${MISSING}" ]; then
            echo "Required checks already started on ${SHA}."
            exit 0
          fi

          # GITHUB_TOKEN may not start push/pull_request workflows, but it
          # can create workflow_dispatch runs. Prefer dispatching CI, Bencher,
          # and Judge on the release branch (native checks on this SHA). If
          # that ref's workflow files lack workflow_dispatch, fall back to
          # Lockfile required checks on the default branch, which reports
          # the same check names onto this SHA via the Checks API.
          # Dispatch whenever checks are missing. A classic or release
          # token push starts pull_request workflows on the release
          # branch. ci.yml, bencher.yml, and judge.yml listen for push
          # only on main, so skip dispatch only when that push used
          # classic or release and BRANCH is the default branch.
          # pushed_with is github when the probe fell back or a 403
          # retry used GITHUB_TOKEN. Also dispatch when this step did
          # not push.
          user_token=false
          case "${PUSHED_WITH:-${TOKEN_SOURCE}}" in
            classic|release) user_token=true ;;
          esac
          if [ "${user_token}" != "true" ] || [ "${PUSHED:-false}" != "true" ] || [ "${BRANCH}" != "${DEFAULT_BRANCH}" ]; then
            echo "Required checks missing on ${SHA}; dispatching (pushed_with=${PUSHED_WITH:-unset} token_source=${TOKEN_SOURCE:-unset} pushed=${PUSHED:-false} branch=${BRANCH} default=${DEFAULT_BRANCH})"
            if gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run bencher.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}" \
               && gh workflow run judge.yml --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH}"; then
              echo "Dispatched CI, Bencher, and Judge on ${BRANCH} (head ${SHA})"
            else
              echo "workflow_dispatch on ${BRANCH} failed or is unavailable; dispatching Lockfile required checks on ${DEFAULT_BRANCH} for ${SHA}"
              gh workflow run lockfile-required-checks.yml --repo "${GITHUB_REPOSITORY}" --ref "${DEFAULT_BRANCH}" \
                -f "sha=${SHA}" -f "branch=${BRANCH}"
            fi
          fi

          echo "Waiting for required check runs on ${SHA} (${BRANCH}): ${REQUIRED} (Judge also accepts Judge (…) matrix jobs; ${ATTEMPTS} attempts, ${SLEEP_SECS}s)"
          for i in $(seq 1 "${ATTEMPTS}"); do
            read_checks
            echo "attempt ${i}/${ATTEMPTS}: ${COUNT} check runs; missing required: ${MISSING:-none}"
            if [ -z "${MISSING}" ]; then
              jq '.check_runs | map(.name)' <<< "${CHECK_RUNS}"
              exit 0
            fi
            sleep "${SLEEP_SECS}"
          done
          echo "::error::Required checks did not start for ${SHA} (need Build, Codecov, Bencher, Protected paths, and Judge or a Judge (…) matrix job). A GITHUB_TOKEN push does not trigger push/pull_request workflows. The job prefers RELEASE_PLEASE_CLASSIC_TOKEN so the release-branch push starts those workflows, and dispatches CI/Bencher/Judge or Lockfile required checks when that push did not."
          exit 1

  annotate-release:
    name: Coverage delta on release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/rust-cache
        with:
          key: coverage-conformance
      # Coverage (implemented ÷ units) is in the tag's summary.json.
      # Conformance is not: that field is the regression baseline.
      # Decision 0030. Read gh-pages judge-history.json, then the Judge
      # artifact for the commit. Never print the baseline's 0%.
      - name: Append coverage and conformance delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Empty history only on 404. A transient failure must not look
          # like "no publication" and drop a real delta.
          history_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/coverage/judge-history.json"
          code="$(curl --retry 3 --retry-delay 2 -sS -o /tmp/judge-history.json -w '%{http_code}' "$history_url" || true)"
          if [ "$code" = "404" ]; then
            echo '{"schema":1,"runs":[]}' > /tmp/judge-history.json
          elif [ "$code" != "200" ]; then
            echo "judge history download failed: HTTP ${code:-none}" >&2
            exit 1
          elif ! jq -e '.schema == 1 and (.runs | type == "array")' /tmp/judge-history.json >/dev/null; then
            echo "judge history is not schema 1" >&2
            exit 1
          fi
          from_history() {
            jq -r --arg s "$1" '([.runs[] | select(.sha == $s)][0] // empty) as $r | if $r == null or $r == "" then empty else "\($r.percent) \($r.passing) \($r.cases)" end' /tmp/judge-history.json
          }
          # 0 and a line: measured. 1: no Judge publication. 2: operational
          # failure (API, download, or the conformance command). Callers
          # must not turn status 2 into "not measured".
          from_artifact() {
            local run_id="$1" sha="$2" dest line
            dest="/tmp/judge-${sha}"
            rm -rf "$dest"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name judge-results --dir "$dest"; then
              echo "downloading judge-results for ${sha} failed" >&2
              return 2
            fi
            local file
            file="$(find "$dest" -name judge-results.json -print -quit)"
            if [ -z "$file" ]; then
              return 1
            fi
            if ! line="$(cargo run --quiet --locked -p megabase-coverage -- conformance "$file")"; then
              echo "conformance command failed for ${sha}" >&2
              return 2
            fi
            if [ -z "$line" ]; then
              echo "conformance command returned no result for ${sha}" >&2
              return 2
            fi
            printf '%s\n' "$line"
          }
          # $2 is "wait" for the release commit (Judge may still be running)
          # and "once" for an older tag.
          measure() {
            local sha="$1" mode="$2" hit run_id json attempts i art_rc successes cid names pending total
            if ! hit="$(from_history "$sha")"; then
              echo "reading judge history failed for ${sha}" >&2
              return 2
            fi
            if [ -n "$hit" ]; then
              printf '%s\n' "$hit"
              return 0
            fi
            attempts=1
            if [ "$mode" = "wait" ]; then
              attempts=50
            fi
            for i in $(seq 1 "$attempts"); do
              # One SHA can have several Judge runs. Use the newest completed
              # success that published judge-results. A newer failure or
              # cancellation must not hide that artifact.
              if ! json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow judge.yml --commit "$sha" --limit 50 --json databaseId,status,conclusion,createdAt)"; then
                echo "listing Judge runs failed for ${sha}" >&2
                return 2
              fi
              if ! successes="$(jq -c '[.[] | select(.status == "completed" and .conclusion == "success" and .databaseId != null)] | sort_by(.createdAt // "", .databaseId) | reverse' <<<"$json")"; then
                echo "selecting Judge run failed for ${sha}" >&2
                return 2
              fi
              run_id=""
              while IFS= read -r cid; do
                [ -n "$cid" ] || continue
                if ! names="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${cid}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "judge-results" and (.expired != true)) | .name')"; then
                  echo "listing Judge artifacts failed for run ${cid}" >&2
                  return 2
                fi
                if [ -n "$names" ]; then
                  run_id="$cid"
                  break
                fi
              done < <(jq -r '.[].databaseId' <<<"$successes")
              if [ -n "$run_id" ]; then
                # A failed `if` test leaves status 0, so read the command
                # status itself. 1 stays "no publication"; 2 stays an error.
                hit="$(from_artifact "$run_id" "$sha")"
                art_rc=$?
                if [ "$art_rc" -eq 0 ]; then
                  printf '%s\n' "$hit"
                  return 0
                fi
                return "$art_rc"
              fi
              # No completed success has judge-results. Wait only while a
              # run can still publish. A finished run without the artifact
              # is "not measured".
              if ! pending="$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$json")"; then
                echo "reading Judge run status failed for ${sha}" >&2
                return 2
              fi
              if ! total="$(jq -r 'length' <<<"$json")"; then
                echo "reading Judge run status failed for ${sha}" >&2
                return 2
              fi
              if [ "$mode" = "wait" ] && { [ "$total" -eq 0 ] || [ "$pending" -gt 0 ]; }; then
                echo "Waiting for Judge on ${sha} (pending=${pending}, attempt ${i}/${attempts})" >&2
                sleep 60
                continue
              fi
              return 1
            done
            return 1
          }
          # $1 is the variable to set. Status 1 clears it. Status 2 aborts.
          record_measure() {
            local sha="$2" mode="$3" value rc
            set +e
            value="$(measure "$sha" "$mode")"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "conformance measurement failed for ${sha}" >&2
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              value=""
            fi
            printf -v "$1" '%s' "$value"
          }
          coverage_text() {
            jq -r '"coverage \(.percent.coverage)% (\(.totals.implemented)/\(.totals.units) units implemented)"' "$1"
          }
          bullet() {
            local label="$1" summary="$2" conf="${3:-}"
            local cov
            cov="$(coverage_text "$summary")"
            if [ -n "$conf" ]; then
              read -r pct passing cases <<<"$conf"
              echo "- ${label}: ${cov}, conformance ${pct}% (${passing}/${cases} judge cases)"
            else
              echo "- ${label}: ${cov}, conformance not measured (no Judge publication for this commit; the git baseline is not the score)"
            fi
          }
          git show "${TAG}:coverage/summary.json" > /tmp/cur.json
          CUR_SHA="$(git rev-parse "${TAG}^{commit}")"
          # Wait only for this push. release-please can open notes for an
          # older tag; that SHA will not gain a Judge run on this commit.
          CUR_MODE=once
          if [ "$CUR_SHA" = "$GITHUB_SHA" ]; then
            CUR_MODE=wait
          fi
          record_measure CUR_CONF "$CUR_SHA" "$CUR_MODE"
          {
            echo
            echo "## Coverage and conformance"
            echo
            bullet "This release" /tmp/cur.json "$CUR_CONF"
            PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')"
            if [ -n "${PREV:-}" ] && git cat-file -e "${PREV}:coverage/summary.json" 2>/dev/null; then
              git show "${PREV}:coverage/summary.json" > /tmp/prev.json
              PREV_SHA="$(git rev-parse "${PREV}^{commit}")"
              record_measure PREV_CONF "$PREV_SHA" once
              bullet "Previous release (\`${PREV}\`)" /tmp/prev.json "$PREV_CONF"
              cov_delta="$(jq -s -r '.[0].percent.coverage - .[1].percent.coverage | . * 10 | round / 10' /tmp/cur.json /tmp/prev.json)"
              if [ -n "$CUR_CONF" ] && [ -n "$PREV_CONF" ]; then
                conf_delta="$(jq -n --argjson c "${CUR_CONF%% *}" --argjson p "${PREV_CONF%% *}" '($c - $p) * 10 | round / 10')"
                echo "- Delta: coverage ${cov_delta} pp, conformance ${conf_delta} pp"
              else
                echo "- Delta: coverage ${cov_delta} pp (conformance delta omitted; a side has no Judge publication)"
              fi
            else
              echo "- Initial release (no previous tag)."
            fi
          } > /tmp/delta.md
          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          cat /tmp/delta.md >> /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md

  # OpenSSF Scorecard Packaging + Signed-Releases: attach musl-static linux
  # binaries, SHA256SUMS, cosign keyless .sig/.pem, SLSA .intoto.jsonl, and
  # publish a version-tagged image to ghcr.io/zouhairmaj/megabase (cosign).
  # id-token: write stays on sign-and-publish only.
  # Push builds run only when this commit is the release tag.
  # attest-build-provenance records GITHUB_SHA. release-please can set
  # release_created for an older tag on a later push (run 38007606007
  # published v0.1.1 at ff54751 while this run was a3a1300); those
  # builds must skip, not fail the SHA check. workflow_dispatch still
  # runs, and the SHA check step requires Use workflow from = the tag.
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.sha == github.sha))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: release-${{ matrix.target }}
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file
      - name: Build static megabase
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}" -p megabase --bin megabase
          BIN="target/${TARGET}/release/megabase"
          info="$(file "${BIN}")"
          echo "${info}"
          if echo "${info}" | grep -qi 'dynamically linked'; then
            echo "::error::${BIN} is dynamically linked; expected musl-static"
            ldd "${BIN}" || true
            exit 1
          fi
          if ! echo "${info}" | grep -qiE 'static'; then
            echo "::error::${BIN} is not statically linked (musl static required)"
            exit 1
          fi
          strip "${BIN}" || true
          mkdir -p dist
          ASSET="megabase-${TAG}-${TARGET}"
          cp "${BIN}" "dist/${ASSET}"
          echo "ASSET=${ASSET}" >> "${GITHUB_ENV}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: megabase-binary-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 5

  sign-and-publish:
    name: Sign and publish
    needs: [release-please, build-binaries]
    if: always() && !cancelled() && needs.build-binaries.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      IMAGE: ghcr.io/zouhairmaj/megabase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Require run SHA matches the release tag
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse "${TAG}^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not tag ${TAG} (${EXPECTED})"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${EXPECTED}" ]; then
            echo "::error::Dispatch Release from tag ${TAG} (Use workflow from = ${TAG}). attest-build-provenance records the run SHA (${GITHUB_SHA}), not the checkout ref (${EXPECTED})."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: megabase-binary-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum megabase-* > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign blobs (Sigstore keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in megabase-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
      - name: SLSA provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach provenance as .intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE}" "dist/megabase-${TAG}.intoto.jsonl"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* --clobber
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version without v prefix
        id: version
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign image (Sigstore keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
