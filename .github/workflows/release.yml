name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # bootstrap-sha is the Phase 0 merge (7aa41e8, exclusive). Commits
      # before it use [phase0]/[brand]/Day 0 subjects that
      # conventional-commits-parser rejects. Those are warnings, not
      # release-please failures; skipping them keeps the log clean. The
      # job still fails on real errors (config, permissions, API).
      #
      # RELEASE_PLEASE_TOKEN must be a PAT or GitHub App token that can
      # create PRs and whose pushes start workflows. GITHUB_TOKEN cannot
      # create PRs until the Actions setting is enabled, and even then a
      # GITHUB_TOKEN push still does not trigger workflows.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  sync-lockfile:
    name: Sync Cargo.lock
    needs: release-please
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Checkout the release-please branch
        id: branch
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/release-please--branches--*:refs/remotes/origin/release-please--branches--*'
          mapfile -t BRANCHES < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-please--branches--*' | sed 's#^origin/##')
          if [ "${#BRANCHES[@]}" -eq 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release-please branch on origin."
            exit 0
          fi
          BRANCH="${BRANCHES[0]}"
          for b in "${BRANCHES[@]}"; do
            if [[ "$b" == *megabase* ]]; then
              BRANCH="$b"
              break
            fi
          done
          git checkout --track "origin/${BRANCH}"
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.branch.outputs.exists == 'true'
        with:
          toolchain: stable
      - name: Match lockfile workspace versions
        if: steps.branch.outputs.exists == 'true'
        run: cargo update -w
      - name: Commit Cargo.lock if it changed
        id: commit
        if: steps.branch.outputs.exists == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already matches workspace versions."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync Cargo.lock with workspace version"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Confirm required checks started on the lockfile head
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          if [ "${PUSHED:-false}" != "true" ]; then
            echo "No lockfile commit; nothing to confirm."
            exit 0
          fi
          SHA="$(git rev-parse HEAD)"
          echo "Waiting for check runs on ${SHA} (${BRANCH})"
          for i in $(seq 1 20); do
            COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --jq '.total_count')"
            echo "attempt ${i}: ${COUNT} check runs"
            if [ "${COUNT}" -gt 0 ]; then
              gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --jq '.check_runs[:12] | map(.name)'
              exit 0
            fi
            sleep 6
          done
          echo "::error::No check runs started for ${SHA}. A GITHUB_TOKEN push does not trigger workflows. Set repo secret RELEASE_PLEASE_TOKEN (PAT or GitHub App installation token with contents:write) so the lockfile commit is the head that CI checks."
          exit 1

  annotate-release:
    name: Coverage delta on release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Append coverage and conformance delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          sumline() {
            local file="$1" label="$2"
            jq -r --arg l "$label" '
              "- \($l): coverage \(.percent.coverage)% (\(.totals.implemented)/\(.totals.units) units implemented), conformance \(.percent.conformance)% (\(.judge.passing)/\(.judge.cases) judge cases)"
            ' "$file"
          }
          git show "${TAG}:coverage/summary.json" > /tmp/cur.json
          {
            echo
            echo "## Coverage and conformance"
            echo
            sumline /tmp/cur.json "This release"
            PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')"
            if [ -n "${PREV:-}" ] && git cat-file -e "${PREV}:coverage/summary.json" 2>/dev/null; then
              git show "${PREV}:coverage/summary.json" > /tmp/prev.json
              sumline /tmp/prev.json "Previous release (\`${PREV}\`)"
              jq -s -r '
                "- Delta: coverage \((.[0].percent.coverage - .[1].percent.coverage) | tostring) pp, conformance \((.[0].percent.conformance - .[1].percent.conformance) | tostring) pp"
              ' /tmp/cur.json /tmp/prev.json
            else
              echo "- Initial release (no previous tag)."
            fi
          } > /tmp/delta.md
          gh release view "$TAG" --json body --jq .body > /tmp/release-body.md
          cat /tmp/delta.md >> /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
