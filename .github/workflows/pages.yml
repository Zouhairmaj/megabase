name: Deploy placeholder site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Judge]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate site
    if: >
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # workflow_run.head_sha is only trusted after the guard above (push to
    # main). Keep this job read-only so that checkout is not a privileged
    # context. Publication is a later job that does not check the repo out.
    permissions:
      actions: read
      contents: read
    outputs:
      shields: ${{ steps.site.outputs.shields }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pages

      - name: Download judge results
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-results
          path: /tmp/judge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply live judge results
        if: github.event_name == 'workflow_run'
        run: |
          test -f /tmp/judge/judge-results.json
          cp /tmp/judge/judge-results.json coverage/judge-results.json
          cargo run --locked -p megabase-coverage -- update

      - name: Generate site
        id: site
        run: |
          cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site
          if [ -f _site/coverage/badge-coverage.json ]; then
            echo "shields=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-site
          path: _site

      - name: Publish shields JSON to gh-pages
        # Ordinary pushes keep the site deploy below, but they must not
        # replace live badge JSON with the git baseline.
        if: github.event_name == 'workflow_run' && needs.build.outputs.shields == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/coverage
          destination_dir: coverage
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "ci(coverage): publish shields JSON"
          # This branch is only shields JSON. The site is deployed by
          # actions/deploy-pages, so the orphan commit is the whole branch.
          force_orphan: true

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Tries to turn Pages on. This input cannot enable Pages with
          # GITHUB_TOKEN alone; if the site is still off after the first run,
          # set Settings → Pages → Source to GitHub Actions (see HUMAN_LOG.md).
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
