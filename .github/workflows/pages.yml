name: Deploy placeholder site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Generate and publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate site
        run: cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tries to turn Pages on. This input cannot enable Pages with
          # GITHUB_TOKEN alone; if the site is still off after the first run,
          # set Settings → Pages → Source to GitHub Actions (see HUMAN_LOG.md).
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
