name: Build placeholder site

# Push and workflow_dispatch only. Both can write the default-branch
# Actions cache, so this file must not check out a workflow_run ref or
# download a workflow_run artifact. It builds the site and does not
# deploy it. A deploy from this checkout would publish the regression
# baseline (0% conformance) over the live Judge score. Publication is
# pages-badges.yml after Judge on main (decision 0030).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generate site
    runs-on: ubuntu-latest
    # Read-only checkout of the event SHA (the push, or the ref selected
    # for workflow_dispatch). This job uploads a build artifact and does
    # not deploy. pages-badges.yml publishes the live Judge site.
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Trusted event SHA only. Do not download gh-pages or a
      # workflow_run artifact here: this job saves the default-branch
      # Rust cache. Live badges and the Judge-aware site are published
      # by pages-badges.yml.
      - name: Cache site workspace
        uses: ./.github/actions/rust-cache
        with:
          workspace: site
          key: mold

      - uses: ./.github/actions/linux-mold

      - name: Generate site
        run: cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 1
