name: Build placeholder site

# Push, pull_request, and workflow_dispatch. Push and workflow_dispatch can
# write the default-branch Actions cache, so this file must not check out a
# workflow_run ref or download a workflow_run artifact. It builds the site
# and does not deploy it. A deploy from this checkout would publish the
# regression baseline (0% conformance) over the live Judge score. Publication
# is pages-badges.yml after Judge on main (decision 0030).
#
# A pull request that does not change site inputs still runs Generate site
# and reports success, so the check does not stay pending. Push and
# workflow_dispatch always build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not join the `pages` group. pages-badges.yml publishes the live score
# and must not be cancelled by this build. Cancel only superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.paths.outputs.site }}
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/pr-paths

  build:
    name: Generate site
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    # Read-only checkout of the event SHA (the push, the pull request merge
    # commit, or the ref selected for workflow_dispatch). This job uploads a
    # build artifact and does not deploy. pages-badges.yml publishes the live
    # Judge site.
    permissions:
      contents: read
    steps:
      - name: Not applicable
        if: needs.changes.outputs.site == 'false'
        run: echo "This pull request does not change the static site. Generate site reports success without building."

      - name: Check out
        if: needs.changes.outputs.site != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Vendor submodules are not site inputs. Pull requests skip them.
          # Push and workflow_dispatch keep the previous recursive checkout.
          submodules: ${{ github.event_name == 'pull_request' && 'false' || 'recursive' }}

      - name: Install Rust
        if: needs.changes.outputs.site != 'false'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Trusted event SHA only. Do not download gh-pages or a
      # workflow_run artifact here: this job saves the default-branch
      # Rust cache. Live badges and the Judge-aware site are published
      # by pages-badges.yml. The cache action saves only on push to main.
      - name: Cache site workspace
        if: needs.changes.outputs.site != 'false'
        uses: ./.github/actions/rust-cache
        with:
          workspace: site
          key: mold

      - uses: ./.github/actions/linux-mold
        if: needs.changes.outputs.site != 'false'

      - name: Lint and test site
        if: needs.changes.outputs.site != 'false'
        run: |
          cargo fmt --manifest-path site/Cargo.toml -- --check
          cargo clippy --manifest-path site/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path site/Cargo.toml --locked

      - name: Generate site
        if: needs.changes.outputs.site != 'false'
        run: cargo run --manifest-path site/Cargo.toml --locked --release -- --repo-root . --out _site

      - name: Upload site
        if: needs.changes.outputs.site != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 1
