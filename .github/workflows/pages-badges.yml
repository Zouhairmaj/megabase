name: Publish coverage badges

# workflow_run is read-only for the default-branch Actions cache
# (CodeQL actions/cache-poisoning/poisonable-step). This file has no
# push or workflow_dispatch trigger and no cache action, so applying
# the Judge artifact cannot poison that cache. Do not merge it back
# into pages.yml.
#
# Checkout uses the default ref (the default branch). Do not set
# actions/checkout ref from the triggering run: Scorecard
# Dangerous-Workflow treats that ref as an untrusted checkout. The
# Judge file below is data, interpreted by the default-branch tools.

on:
  workflow_run:
    workflows: [Judge]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-badges
  cancel-in-progress: false

jobs:
  build:
    name: Generate site from Judge
    if: >
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      shields: ${{ steps.site.outputs.shields }}
    steps:
      # No ref. For this trigger the default is the default branch.
      # A ref taken from the triggering run is an untrusted checkout.
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Download judge results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-results
          path: /tmp/judge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply live judge results
        run: |
          test -f /tmp/judge/judge-results.json
          cp /tmp/judge/judge-results.json coverage/judge-results.json
          cargo run --locked -p megabase-coverage -- update

      - name: Generate site
        id: site
        run: |
          cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site
          if [ -f _site/coverage/badge-coverage.json ]; then
            echo "shields=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-json
          path: _site/coverage
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish shields JSON
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.shields == 'true'
    runs-on: ubuntu-latest
    # Does not check the repository out. The site itself is
    # deployed only by pages.yml from the event SHA.
    permissions:
      contents: write
    steps:
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-json
          path: _site/coverage

      - name: Publish shields JSON to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/coverage
          destination_dir: coverage
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "ci(coverage): publish shields JSON"
          # This branch is only shields JSON. The site is deployed by
          # actions/deploy-pages, so the orphan commit is the whole branch.
          force_orphan: true
