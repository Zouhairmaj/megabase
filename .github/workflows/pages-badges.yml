name: Publish coverage badges

# workflow_run is read-only for the default-branch Actions cache
# (CodeQL actions/cache-poisoning/poisonable-step). This file has no
# push or workflow_dispatch trigger and no cache action, so applying
# the Judge artifact cannot poison that cache. Do not merge it back
# into pages.yml.

on:
  workflow_run:
    workflows: [Judge]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Same group as pages.yml so a site deploy cannot finish after this
  # job and put older homepage metrics back.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate site from Judge
    if: >
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      shields: ${{ steps.site.outputs.shields }}
      publish: ${{ steps.tip.outputs.publish }}
    steps:
      - name: Check out Judge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Skip when this Judge commit is not the current main tip
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Judge commit ${HEAD_SHA} is not main tip ${tip}; skipping publish."
          fi

      - name: Install Rust
        if: steps.tip.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Download judge results
        if: steps.tip.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-results
          path: /tmp/judge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply live judge results
        if: steps.tip.outputs.publish == 'true'
        run: |
          test -f /tmp/judge/judge-results.json
          cp /tmp/judge/judge-results.json coverage/judge-results.json
          cargo run --locked -p megabase-coverage -- update

      - name: Generate site
        id: site
        if: steps.tip.outputs.publish == 'true'
        run: |
          cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site
          if [ -f _site/coverage/badge-coverage.json ]; then
            echo "shields=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        if: steps.tip.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish shields and site
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-site
          path: _site

      - name: Publish shields JSON to gh-pages
        if: needs.build.outputs.shields == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/coverage
          destination_dir: coverage
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "ci(coverage): publish shields JSON"
          # This branch is only shields JSON. The site is deployed by
          # actions/deploy-pages, so the orphan commit is the whole branch.
          force_orphan: true

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
