name: Publish coverage badges

# workflow_run is read-only for the default-branch Actions cache
# (CodeQL actions/cache-poisoning/poisonable-step). This file has no
# push or workflow_dispatch trigger and does not use actions/cache.
# sccache writes R2, not that cache, so applying the Judge artifact
# cannot poison it. Do not merge this file back into pages.yml.
#
# Checkout uses the default ref (the default branch). Do not set
# actions/checkout ref from the triggering run: Scorecard
# Dangerous-Workflow treats that ref as an untrusted checkout. The
# Judge file below is data, interpreted by the default-branch tools.
# Policy for applying that data: status::judge_results_apply.

on:
  workflow_run:
    workflows: [Judge]
    types: [completed]

permissions:
  contents: read

env:
  # Composite actions cannot read secrets or vars.
  SCCACHE_R2_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  SCCACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
  SCCACHE_BUCKET_NAME: ${{ vars.SCCACHE_BUCKET }}
  SCCACHE_ENDPOINT_URL: ${{ vars.SCCACHE_ENDPOINT }}

concurrency:
  # Serializes publishes. pages.yml does not deploy and is not in this
  # group; a baseline site must not replace the live Judge score.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate site from Judge
    if: >
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      shields: ${{ steps.site.outputs.shields }}
    steps:
      # No ref. For this trigger the default is the default branch.
      # A ref taken from the triggering run is an untrusted checkout.
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0   # full history for TOTAL COMMITS

      # Apply the artifact when the Judge commit is this checkout or an
      # ancestor of it. Main usually moves during the Judge run, so an
      # equality check drops the results. Do not check that commit out.
      - name: Judge commit is contained in checkout
        id: match
        env:
          JUDGE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ ! "$JUDGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Judge SHA is not a commit id" >&2
            exit 1
          fi
          if [[ ! "$checked_out" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Checkout SHA is not a commit id" >&2
            exit 1
          fi
          if [ "$checked_out" = "$JUDGE_SHA" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Retry a transient compare failure. Do not treat it as match=false:
          # a green skip is how results were dropped. The last failure exits.
          status=""
          attempt=1
          until status="$(gh api --jq '.status // empty' "repos/${GITHUB_REPOSITORY}/compare/${JUDGE_SHA}...${checked_out}")"; do
            if [ "$attempt" -ge 3 ]; then
              echo "Compare API failed for $JUDGE_SHA...$checked_out" >&2
              exit 1
            fi
            sleep $((attempt * 2))
            attempt=$((attempt + 1))
          done
          if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
            echo "Judge commit $JUDGE_SHA is contained in $checked_out ($status). Applying results as data."
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "Judge results are for $JUDGE_SHA; checkout is $checked_out ($status). Skipping publish."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.match.outputs.match == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/sccache
        if: steps.match.outputs.match == 'true'

      - name: Download judge results
        if: steps.match.outputs.match == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: judge-results
          path: /tmp/judge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply live judge results
        if: steps.match.outputs.match == 'true'
        run: |
          test -f /tmp/judge/judge-results.json
          cp /tmp/judge/judge-results.json coverage/judge-results.json
          cargo run --locked -p megabase-coverage -- update

      # Carry the per-commit score forward in the file. force_orphan below
      # drops git history on gh-pages, so the JSON is the record release
      # notes read. Do not check the Judge commit out.
      - name: Record judge history
        if: steps.match.outputs.match == 'true'
        env:
          JUDGE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$JUDGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Judge SHA is not a commit id" >&2
            exit 1
          fi
          # Absence is a 404 from the git tree on gh-pages. The raw CDN
          # can 404 while that file still exists; writing an empty history
          # and then force_orphan would drop every earlier run. Judge
          # artifacts expire in a day, so that loss cannot be rebuilt.
          # Any other status or a transport error fails before publish.
          history_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/coverage/judge-history.json?ref=gh-pages"
          code=""
          attempt=1
          while [ "$attempt" -le 3 ]; do
            code="$(curl --retry 3 --retry-delay 2 -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o /tmp/judge-history.json \
              -w '%{http_code}' \
              "$history_url" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            if [ "$code" != "404" ]; then
              echo "judge history download failed: HTTP ${code:-none}" >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "judge history is not in the gh-pages tree yet (attempt ${attempt}/3)" >&2
            sleep $((attempt * 2))
            attempt=$((attempt + 1))
          done
          if [ "$code" = "404" ]; then
            echo '{"schema":1,"runs":[]}' > /tmp/judge-history.json
          elif ! jq -e '.schema == 1 and (.runs | type == "array")' /tmp/judge-history.json >/dev/null; then
            echo "judge history is not schema 1" >&2
            exit 1
          fi
          cargo run --locked -p megabase-coverage -- judge-history \
            /tmp/judge-history.json "$JUDGE_SHA" coverage/judge-results.json \
            > coverage/judge-history.json

      - name: Generate site
        id: site
        if: steps.match.outputs.match == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}   # TOTAL PRS via search API
        run: |
          cargo run --manifest-path site/Cargo.toml --release -- --repo-root . --out _site
          test -f _site/coverage/summary.json
          test -f _site/coverage/badge-coverage.json
          test -f _site/coverage/badge-conformance.json
          test -f _site/coverage/treemap.png
          test -f _site/coverage/treemap-light.png
          test -f _site/coverage/judge-history.json
          echo "shields=true" >> "$GITHUB_OUTPUT"

      - name: Upload site
        if: steps.match.outputs.match == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site
          path: _site
          if-no-files-found: error
          retention-days: 1

      - name: sccache stats
        if: always() && steps.match.outputs.match == 'true'
        run: sccache --show-stats

  deploy:
    name: Publish shields JSON and site
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.shields == 'true'
    runs-on: ubuntu-latest
    # Does not check the repository out. The Judge JSON was already
    # interpreted by the default-branch tools in the build job.
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-site
          path: _site

      - name: Publish shields JSON to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/coverage
          destination_dir: coverage
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "ci(coverage): publish shields JSON"
          # This branch is shields JSON plus the README treemap PNGs.
          # The site HTML is deployed by actions/deploy-pages.
          force_orphan: true

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
