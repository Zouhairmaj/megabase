name: Judge database image
description: >-
  Pull the reference Postgres image that judge/compose.override.yml pins
  from its ghcr.io mirror. When the mirror cannot be pulled (not yet
  mirrored, private, or ghcr is down), pull the same tag and digest from
  public.ecr.aws instead and export MEGABASE_JUDGE_DB_IMAGE so Compose
  uses that reference. Issue #350.

outputs:
  image:
    description: The pulled image reference (ghcr.io mirror or ECR fallback).
    value: ${{ steps.pull.outputs.image }}

runs:
  using: composite
  steps:
    - name: Pull the reference Postgres image
      id: pull
      shell: bash
      run: |
        set -euo pipefail
        # The overlay is the one place the reference is written. The mirror
        # workflow (.github/workflows/mirror-postgres-image.yml) reads it the
        # same way.
        mirror=$(sed -n 's|^ *image: \${MEGABASE_JUDGE_DB_IMAGE:-\(ghcr\.io/[^}]*\)}$|\1|p' \
          judge/compose.override.yml)
        if [ "$(printf '%s\n' "$mirror" | grep -c .)" -ne 1 ]; then
          echo "::error::judge/compose.override.yml must have exactly one \${MEGABASE_JUDGE_DB_IMAGE:-ghcr.io/...} image"
          exit 1
        fi
        prefix=ghcr.io/zouhairmaj/supabase-postgres:
        case "$mirror" in
          "$prefix"*@sha256:*) ;;
          *)
            echo "::error::unexpected mirror reference ${mirror}"
            exit 1
            ;;
        esac
        upstream="public.ecr.aws/supabase/postgres:${mirror#"$prefix"}"

        pull() {
          local image=$1 tries=$2 attempt=1
          until docker pull "$image"; do
            if [ "$attempt" -ge "$tries" ]; then
              return 1
            fi
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
        }

        if pull "$mirror" 3; then
          echo "image=${mirror}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::warning::Could not pull ${mirror}. Falling back to ${upstream} (same digest). Run the Mirror Postgres image workflow and make the package public."
        if ! pull "$upstream" 8; then
          echo "::error::failed to pull ${upstream}"
          exit 1
        fi
        echo "MEGABASE_JUDGE_DB_IMAGE=${upstream}" >> "$GITHUB_ENV"
        echo "image=${upstream}" >> "$GITHUB_OUTPUT"
