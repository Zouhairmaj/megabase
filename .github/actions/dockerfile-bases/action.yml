name: Dockerfile base images
description: >-
  Pull each ghcr.io/zouhairmaj/... FROM image in the root Dockerfile from
  its ghcr.io mirror. When a mirror cannot be pulled (not yet mirrored,
  private, or ghcr is down), pull the same tag and digest from the
  upstream listed in .github/image-mirrors.txt and write a copy of the
  Dockerfile that names the upstream instead. Build with the `file`
  output. Issue #358.

outputs:
  file:
    description: >-
      Dockerfile to build: `Dockerfile` when every mirror pulled, else a
      copy under $RUNNER_TEMP that names the upstream registry for the
      mirrors that did not.
    value: ${{ steps.pull.outputs.file }}

runs:
  using: composite
  steps:
    - name: Pull Dockerfile base images
      id: pull
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t refs < <(sed -n \
          's|^FROM \(ghcr\.io/zouhairmaj/[^ ]*\).*$|\1|p' Dockerfile | sort -u)
        if [ "${#refs[@]}" -eq 0 ]; then
          echo "::error::Dockerfile has no FROM ghcr.io/zouhairmaj/... image"
          exit 1
        fi

        pull() {
          local image=$1 tries=$2 attempt=1
          until docker pull "$image"; do
            if [ "$attempt" -ge "$tries" ]; then
              return 1
            fi
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
        }

        file=Dockerfile
        for mirror in "${refs[@]}"; do
          case "$mirror" in
            ghcr.io/zouhairmaj/*:*@sha256:*) ;;
            *)
              echo "::error::unexpected mirror reference ${mirror}"
              exit 1
              ;;
          esac
          repo=${mirror%%:*}
          upstream_repo=$(awk -v r="$repo" '$1 == r { print $2 }' .github/image-mirrors.txt)
          if [ -z "$upstream_repo" ]; then
            echo "::error::${repo} is not listed in .github/image-mirrors.txt"
            exit 1
          fi
          upstream="${upstream_repo}:${mirror#"$repo":}"

          if pull "$mirror" 3; then
            continue
          fi
          echo "::warning::Could not pull ${mirror}. Falling back to ${upstream} (same digest). Run the Mirror images workflow and make the package public."
          if ! pull "$upstream" 8; then
            echo "::error::failed to pull ${upstream}"
            exit 1
          fi
          if [ "$file" = Dockerfile ]; then
            file="${RUNNER_TEMP}/Dockerfile.upstream"
            cp Dockerfile "$file"
          fi
          # Exact reference match only; the tag and digest stay the same.
          MIRROR="$mirror" UPSTREAM="$upstream" \
            awk '$1 == "FROM" && $2 == ENVIRON["MIRROR"] { $2 = ENVIRON["UPSTREAM"] } { print }' \
            "$file" > "${file}.tmp"
          mv "${file}.tmp" "$file"
        done
        echo "file=${file}" >> "$GITHUB_OUTPUT"
