name: Docker Hub login
description: >-
  Log in to Docker Hub when DOCKERHUB_TOKEN is set. Fork pull requests
  pass an empty token and skip login. A timeout talking to auth.docker.io
  is retried and then ignored so digest-pinned public.ecr.aws and ghcr.io
  pulls still run.

inputs:
  username:
    description: DOCKERHUB_USERNAME
    required: true
  password:
    description: DOCKERHUB_TOKEN
    required: true

runs:
  using: composite
  steps:
    - name: Docker Hub credentials present
      id: dockerhub
      shell: bash
      env:
        DOCKERHUB_TOKEN: ${{ inputs.password }}
      run: |
        if [ -n "${DOCKERHUB_TOKEN}" ]; then
          echo "login=true" >> "$GITHUB_OUTPUT"
        else
          echo "login=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Log in to Docker Hub
      id: action
      if: steps.dockerhub.outputs.login == 'true'
      continue-on-error: true
      timeout-minutes: 2
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Retry Docker Hub login
      if: steps.dockerhub.outputs.login == 'true' && steps.action.outcome == 'failure'
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.password }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4; do
          if timeout 30s docker login -u "${DOCKERHUB_USERNAME}" --password-stdin <<<"${DOCKERHUB_TOKEN}"; then
            exit 0
          fi
          echo "docker login failed (attempt ${attempt}/4)"
          if [ "$attempt" -lt 4 ]; then
            sleep $((attempt * 5))
          fi
        done
        echo "::warning::Docker Hub login failed after retries. Image pulls stay on public.ecr.aws and ghcr.io."
        exit 0
